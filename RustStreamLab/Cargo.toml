[package]
name = "hi5-rust-streamlab"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
webrtc = "=0.13.0"
rtp = "=0.13.0"
env-libvpx-sys = { version = "=5.1.3", features = ["generate"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
