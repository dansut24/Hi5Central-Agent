<body>

function parseNativeResult(res){if(res==null)return{};if(typeof res==='object')return res;try{return JSON.parse(String(res))}catch{return{error:String(res)}}}function displayPath(s){return String(s||'').replace(/\\\\/g,'\\')}function nameOf(p){p=displayPath(p);const t=p.replace(/[\\/]+$/,'');const i=Math.max(t.lastIndexOf('\\'),t.lastIndexOf('/'));return i>=0?t.slice(i+1):t}function fmtSize(n){n=Number(n||0);if(!n)return'';const u=['B','KB','MB','GB','TB'];let i=0;while(n>=1024&&i<u.length-1){n/=1024;i++}return (i? n.toFixed(n<10?1:0):Math.round(n))+' '+u[i]}function setStatus(t,p){statusText.textContent=t||'Ready';statusBar.style.width=(p||0)+'%'}function showToast(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}function normSep(path){return String(path||'').replace(/\\\\/g,'\\')}function isWinRoot(p){p=normSep(p);return /^[A-Za-z]:\\?$/.test(p)}function isRootPath(p){p=normSep(p);return p==='/'||isWinRoot(p)}function joinPath(base,name){base=normSep(base||'');name=String(name||'').replace(/^[\\/]+/,'');if(!base||base==='/')return name;if(/[\\/]$/.test(base))return base+name;return base+(base.includes('\\')?'\\':'/')+name}function safeRel(s){return String(s||'').replace(/^([A-Za-z]:)?[\\/]+/,'').replace(/\.\.[\\/]/g,'')}

function makeQuick(side){const el=$(side+'Quick');el.innerHTML='';const local=[['Desktop','desktop'],['Downloads','downloads'],['Documents','documents'],['This PC','']];const remote=[['Root','/'],['C:\\','C:\\'],['Users','C:\\Users'],['Temp','C:\\Windows\\Temp']];for(const [label,path] of (side==='local'?local:remote)){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(side==='local')loadLocal(path);else loadRemote(path)};el.appendChild(b)}}

ransfer_id||''));st.waiter.reject(new Error(m.error||'Transfer failed'))}else setStatus('Transfer error: '+(m.error||''),0)}else if(m.type==='remote_file_download_error'){const p=String(m.path||'');const waiter=pendingDownloads.get(p);if(waiter){waiter.reject(new Error(m.error||'Remote download failed'));return}setStatus('Download error: '+(m.error||''),0)}else if(String(m.type||'').endsWith('_complete')){setStatus('Complete',100);loadRemote(remotePath.value);setTimeout(()=>setStatus('Ready',0),900)}else if(String(m.type||'').endsWith('_error')){const p=String(m.path||'');const waiter=pendingDownloads.get(p);if(waiter){waiter.reject(new Error(m.error||m.type));return}setStatus('Error: '+(m.error||m.type),0)}}catch(e){setStatus(String(e),0)}};
function addQueue(type,label,run){const item={id:qid++,type,label,state:'queued',progress:0,paused:false,cancelled:false,run};queue.push(item);renderQueue();processQueue();return item}function renderQueue(){queueList.innerHTML='';if(!queue.length){queueList.innerHTML='<div class="empty">No transfers yet</div>';return}for(const q of queue){const div=document.createElement('div');div.className='qrow';div.innerHTML=`<div class="qtop"><div class="qname">${q.label}</div><div class="qstate">${q.state}</div></div><div class="progress" style="width:100%;margin-top:7px"><div class="bar" style="width:${q.progress||0}%"></div></div><div class="qbuttons"><button class="smallbtn pause">${q.paused?'Resume':'Pause'}</button><button class="smallbtn cancel">Cancel</button></div>`;div.querySelector('.pause').onclick=()=>{q.paused=!q.paused;q.state=q.paused?'paused':'queued';renderQueue();processQueue()};div.querySelector('.cancel').onclick=()=>{q.cancelled=true;q.state='cancelled';renderQueue()};queueList.appendChild(div)}}async function processQueue(){if(running)return;const q=queue.find(x=>x.state==='queued'&&!x.cancelled&&!x.paused);if(!q)return;running=true;q.state='running';renderQueue();try{await q.run(q);if(!q.cancelled){q.state='done';q.progress=100;setStatus('Complete',100)}}catch(e){q.state='error: '+String(e);setStatus(String(e),0)}running=false;renderQueue();processQueue()}function updateQ(q,state,p){if(q.cancelled)throw new Error('Cancelled');while(q.paused){return new Promise(r=>setTimeout(r,250)).then(()=>updateQ(q,state,p))}q.state=state;q.progress=p;setStatus(state,p);renderQueue()}
async function uploadLocalPathNow(path,q){const entry=localEntries.find(e=>e.path===path);if(entry&&(entry.is_dir||entry.isDir))return uploadLocalFolderNow(path,joinPath(remotePath.value,entry.name||nameOf(path)),q);updateQ(q,'reading local file',15);const read=parseNativeResult(await window.hi5FileLocalRead(path));if(read.error)throw new Error(read.error);const dest=joinPath(remotePath.value,read.name||nameOf(path));updateQ(q,'uploading '+displayPath(dest),55);await window.hi5FileRemoteUpload(JSON.stringify({path:dest,data:read.data||''}));updateQ(q,'uploaded',100)}async function uploadLocalFolderNow(path,destRoot,q){updateQ(q,'reading local folder',5);const tree=parseNativeResult(await window.hi5FileLocalReadTree(path));if(tree.error)throw new Error(tree.error);const items=Array.isArray(tree.items)?tree.items:[];await window.hi5FileRemoteMkdir(destRoot);let done=0;for(const item of items){done++;const pct=10+Math.round(done/Math.max(1,items.length)*85);const dest=joinPath(destRoot,safeRel(item.rel_path));updateQ(q,'uploading '+displayPath(dest),pct);if(item.is_dir||item.isDir)await window.hi5FileRemoteMkdir(dest);else await window.hi5FileRemoteUpload(JSON.stringify({path:dest,data:item.data||''}))}loadRemote(remotePath.value)}function enqueueUploadLocal(path){addQueue('upload','Upload '+displayPath(nameOf(path)),q=>uploadLocalPathNow(path,q));queuePanel.classList.add('open')}
async function downloadRemotePathNow(path,q){updateQ(q,'requesting remote file',20);const m=await awaitRemoteDownload(path,localPath.value,q);if(m.chunked){loadLocal(localPath.value);updateQ(q,'downloaded',100);return}const target=joinPath(localPath.value,m.name||nameOf(m.path));updateQ(q,'writing local file',80);await window.hi5FileLocalWrite(JSON.stringify({path:target,data:m.data||''}));loadLocal(localPath.value);updateQ(q,'downloaded',100)}function enqueueDownloadRemote(path){const ent=remoteEntries.find(x=>String(x.path||'')===String(path||''));if(ent&&(ent.is_dir||ent.isDir)){setStatus('Remote folder download is disabled until chunked folder transfers are implemented',0);return}if(ent&&isProtectedRemoteEntry(ent)){setStatus('Protected remote item cannot be downloaded',0);return}addQueue('download','Download '+displayPath(nameOf(path)),q=>downloadRemotePathNow(path,q));queuePanel.classList.add('open')}async function enqueueDownloadRemoteFolder(path){setStatus('Remote folder download is disabled until chunked folder transfers are implemented',0);await confirmModal('Folder download disabled','Remote folder download is disabled until chunked folder transfers are implemented. You can open/list folders and download individual files.');return}
function showContext(x,y,e,side){selected={side,e};ctx.innerHTML='';const isDir=!!(e.is_dir||e.isDir),prot=side==='remote'&&isProtectedRemoteEntry(e);const add=(label,fn,opts={})=>{const it=document.createElement('div');it.className='ctxItem'+(opts.disabled?' disabled':'')+(opts.danger?' danger':'');it.textContent=label;it.onclick=()=>{ctx.style.display='none';fn()};ctx.appendChild(it)};if(side==='local'){add('Upload to remote',()=>enqueueUploadLocal(e.path));add('Copy path',()=>navigator.clipboard?.writeText(e.path));add('Rename',async()=>{const n=prompt('New name',e.name||nameOf(e.path));if(n){await window.hi5FileLocalRename(JSON.stringify({from:e.path,to:joinPath((localPath.value),n)}));loadLocal(localPath.value)}});add('Delete',async()=>{if(await confirmModal('Delete local item?','Delete '+displayPath(e.path)+'?')){await window.hi5FileLocalDelete(e.path);loadLocal(localPath.value)}},{danger:true})}else{add(isDir?'Download folder (disabled)':'Download',()=>isDir?enqueueDownloadRemoteFolder(e.path):enqueueDownloadRemote(e.path),{disabled:prot||isDir});add('Upload here',()=>{}, {disabled:!isDir||prot});add('Copy path',()=>navigator.clipboard?.writeText(displayPath(e.path)));add('Rename',async()=>{const n=prompt('New name',e.name||nameOf(e.path));if(n){await window.hi5FileRemoteRename(JSON.stringify({from:e.path,to:joinPath(remotePath.value,n)}));loadRemote(remotePath.value)}},{disabled:prot});add('Delete',async()=>{if(await confirmModal('Delete remote item?','Delete '+displayPath(e.path)+'? This cannot be undone.')){await window.hi5FileRemoteDelete(e.path);loadRemote(remotePath.value)}},{danger:true,disabled:prot})}ctx.style.left=Math.min(x,innerWidth-210)+'px';ctx.style.top=Math.min(y,innerHeight-230)+'px';ctx.style.display='block'}document.addEventListener('click',()=>ctx.style.display='none');document.addEventListener('keydown',e=>{if(e.key==='Escape')ctx.style.display='none'});
async function readEntriesFromDrop(dt){const out=[];async function readFile(file,rel){const data=await file.arrayBuffer();let bin='';const bytes=new Uint8Array(data);for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);out.push({rel_path:rel||file.name,name:file.name,is_dir:false,data:btoa(bin)})}async function walkEntry(entry,prefix){return new Promise(resolve=>{if(entry.isFile){entry.file(async f=>{await readFile(f,(prefix?prefix+'/':'')+f.name);resolve()},()=>resolve())}else if(entry.isDirectory){out.push({rel_path:(prefix?prefix+'/':'')+entry.name,name:entry.name,is_dir:true});const reader=entry.createReader();const readBatch=()=>reader.readEntries(async entries=>{if(!entries.length){resolve();return}for(const child of entries)await walkEntry(child,(prefix?prefix+'/':'')+entry.name);readBatch()},()=>resolve());readBatch()}else resolve()})}const items=dt.items?[...dt.items]:[];let used=false;for(const it of items){const entry=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(entry){used=true;await walkEntry(entry,'')}}if(!used&&dt.files){for(const f of [...dt.files])await readFile(f,f.webkitRelativePath||f.name)}return out}
function wireDrop(el,side){el.addEventListener('dragover',e=>{e.preventDefault();el.closest('.pane')?.classList.add('drop')});el.addEventListener('dragleave',()=>el.closest('.pane')?.classList.remove('drop'));el.addEventListener('drop',async e=>{e.preventDefault();el.closest('.pane')?.classList.remove('drop');const lp=e.dataTransfer.getData('application/hi5-local-path'),rp=e.dataTransfer.getData('application/hi5-remote-path');if(side==='remote'&&lp){enqueueUploadLocal(lp);return}if(side==='local'&&rp){const ent=remoteEntries.find(x=>String(x.path||'')===String(rp));if(ent&&isProtectedRemoteEntry(ent)){setStatus('Protected remote item cannot be downloaded',0);return}const isDir=e.dataTransfer.getData('application/hi5-remote-isdir')==='1';if(isDir){setStatus('Remote folder download is disabled until chunked folder transfers are implemented',0);return}enqueueDownloadRemote(rp);return}if(side==='remote'&&e.dataTransfer.files&&e.dataTransfer.files.length){const items=await readEntriesFromDrop(e.dataTransfer);addQueue('upload','Upload dropped items',async q=>{let done=0;for(const item of items){done++;const dest=joinPath(remotePath.value,safeRel(item.rel_path||item.name));updateQ(q,'uploading '+displayPath(dest),Math.round(done/Math.max(1,items.length)*100));if(item.is_dir||item.isDir)await window.hi5FileRemoteMkdir(dest);else await window.hi5FileRemoteUpload(JSON.stringify({path:dest,data:item.data||''}))}loadRemote(remotePath.value)});queuePanel.classList.add('open')}})}wireDrop(remoteList,'remote');wireDrop(localList,'local');
$('localOpen').onclick=()=>loadLocal(localPath.value);$('remoteOpen').onclick=()=>loadRemote(remotePath.value);$('refreshBoth').onclick=()=>{loadLocal(localPath.value);loadRemote(remotePath.value)};$('localNew').onclick=async()=>{const n=prompt('Folder name');if(n){await window.hi5FileLocalMkdir(joinPath(localPath.value,n));loadLocal(localPath.value)}};$('remoteNew').onclick=async()=>{const n=prompt('Folder name');if(n){await window.hi5FileRemoteMkdir(joinPath(remotePath.value,n));loadRemote(remotePath.value)}};$('queueToggle').onclick=()=>queuePanel.classList.toggle('open');$('clearDone').onclick=()=>{queue=queue.filter(q=>q.state!=='done'&&q.state!=='cancelled');renderQueue()};
window.__hi5FileInitialLoad=function(){Promise.resolve(window.hi5FileGetContext('')).then(parseNativeResult).then(ctx=>{if(ctx.local_label)localTitle.textContent=ctx.local_label;if(ctx.remote_label)remoteTitle.textContent=ctx.remote_label}).finally(()=>{makeQuick('local');makeQuick('remote');loadLocal('');loadRemote('/')})};try{window.hi5FileReady('')}catch(e){};setTimeout(()=>window.__hi5FileInitialLoad(),120);
})();
