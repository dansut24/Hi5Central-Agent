name: Sync GPU transport 0.1.40

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - .github/workflows/sync-gpu-transport-0.1.40.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0

      - name: Download and verify exact source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          wget -qO /tmp/gpu-transport-0140.tar.gz 'https://downloads.hi5central.com/bootstrap-agent-sync/gpu-transport-0.1.40-6d941e8.tar.gz'
          echo '2d6a91835403ec9b1e0ac5ade8410cb060cf44f918f1d799c3b7a4f14b1aea46  /tmp/gpu-transport-0140.tar.gz' | sha256sum -c -
          tar -xzf /tmp/gpu-transport-0140.tar.gz -C .

      - name: Commit exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hi5Central Build Bot'
          git config user.email 'buildbot@hi5central.com'
          git add \
            Agent/chatpass_agent/CMakeLists.txt \
            Agent/chatpass_agent/src/frame_source.h \
            Agent/chatpass_agent/src/ipc/shmem_ring.h \
            Agent/chatpass_agent/src/media_host_main.cpp \
            Agent/chatpass_agent/src/platform/windows/shared_gpu_frame_reader.cpp \
            Agent/chatpass_agent/src/platform/windows/shared_gpu_frame_reader.h \
            Agent/chatpass_agent/src/platform/windows/windows_screen.cpp \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/streamer_main.cpp
          if git diff --cached --quiet; then
            echo 'Checkpoint already applied.'
            exit 0
          fi
          git commit -m 'Transport normal desktop frames as shared D3D11 textures [skip ci]'
          git push origin HEAD:agent-hardening-v2
