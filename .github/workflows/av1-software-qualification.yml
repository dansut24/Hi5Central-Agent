name: Experimental libaom AV1 Encode and RTP Qualification

on:
  pull_request:
    paths:
      - 'Agent/chatpass_agent/src/encoding/av1_software_encoder_experimental.*'
      - 'Agent/chatpass_agent/src/encoding/av1_rtp_payload_experimental.h'
      - 'Agent/chatpass_agent/tests/av1_software_encoder_test.cpp'
      - '.github/workflows/av1-software-qualification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  av1-software:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install libaom development files (isolated CI runner only)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libaom-dev
      - name: Compile isolated C++ encoder and packetiser
        run: |
          mkdir -p dist
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic \
            Agent/chatpass_agent/tests/av1_software_encoder_test.cpp \
            Agent/chatpass_agent/src/encoding/av1_software_encoder_experimental.cpp \
            -laom -o dist/av1_software_encoder_test
      - name: Qualify 360p, 720p and 1080p AV1 encode, RTP reassembly, and decoder restart
        run: |
          set -o pipefail
          timeout 90s dist/av1_software_encoder_test | tee dist/av1-360p.txt
          timeout 120s dist/av1_software_encoder_test --720p | tee dist/av1-720p.txt
          timeout 160s dist/av1_software_encoder_test --1080p | tee dist/av1-1080p.txt
          cat dist/av1-360p.txt dist/av1-720p.txt dist/av1-1080p.txt > dist/av1-software-qualification.txt
      - uses: actions/upload-artifact@v4
        with:
          name: libaom-av1-qualification-report
          path: dist/av1-software-qualification.txt
          retention-days: 14
