name: Sync private Explorer shell 0.1.48

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-private-explorer-shell-0.1.48.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/private-explorer-shell-0.1.48-c1301fd.tar.gz -O /tmp/private-explorer-shell.tar.gz
          echo "cea77fc080489a3f42d72cbc360a8cbce2e49c6bd4f7c2c3db9ff564d8a9b777  /tmp/private-explorer-shell.tar.gz" | sha256sum -c -
          tar -xzf /tmp/private-explorer-shell.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/backstage/backstage_host.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source already synchronized"
          else
            git commit -m "Start private Explorer shell for Background mode [skip ci]"
            git push origin HEAD:agent-hardening-v2
          fi
