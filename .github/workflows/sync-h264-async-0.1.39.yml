name: Sync H264 async MFT 0.1.39

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - .github/workflows/sync-h264-async-0.1.39.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0

      - name: Download and verify exact source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          wget -qO /tmp/h264-async-mft-0139.tar.gz 'https://downloads.hi5central.com/bootstrap-agent-sync/h264-async-mft-0.1.39-f65a131.tar.gz'
          echo '3893d790699c7afc58b682ffd2b832d926b109387f4786ed502ccef034dabb7c  /tmp/h264-async-mft-0139.tar.gz' | sha256sum -c -
          tar -xzf /tmp/h264-async-mft-0139.tar.gz -C .

      - name: Commit exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hi5Central Build Bot'
          git config user.email 'buildbot@hi5central.com'
          git add Agent/chatpass_agent/src/h264_mf_encoder.cpp
          if git diff --cached --quiet; then
            echo 'Checkpoint already applied.'
            exit 0
          fi
          git commit -m 'Drive H264 async MFT with event credits [skip ci]'
          git push origin HEAD:agent-hardening-v2
