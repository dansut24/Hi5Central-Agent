name: Portable Agent macOS and Linux

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/portable-macos-linux-agent
      - feature/portable-websocket-jobs
      - fix/linux-portable-agent-upgrade
      - fix/linux-unit-validation-recovery
      - feature/unix-terminal-files-user-root
      - feature/portable-software-inventory
      - feature/portable-native-software-actions
      - fix/macos-user-file-helper-context
      - fix/software-inventory-classification
      - fix/software-inventory-safe-view
  pull_request:

permissions:
  contents: read

concurrency:
  group: portable-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libssl-dev libvpx-dev libx11-dev libxext-dev libxtst-dev pkg-config
      - name: Configure
        run: |
          cmake -S Agent/portable_agent -B build/portable-linux -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DHI5CENTRAL_AGENT_VERSION=0.3.${{ github.run_number }}
      - name: Build
        run: cmake --build build/portable-linux
      - name: Runtime self-test
        run: |
          bash -n Agent/portable_agent/installer/linux/install.sh
          unit_file="$(mktemp --suffix=.service /tmp/hi5central-agent-ci-XXXXXX)"
          cat > "$unit_file" <<'EOF'
          [Unit]
          Description=Hi5Central Agent CI unit validation
          [Service]
          Type=simple
          ExecStart=/bin/true
          EOF
          systemd-analyze verify "$unit_file"
          rm -f "$unit_file"
          build/portable-linux/Hi5CentralAgent --version
          build/portable-linux/Hi5CentralAgent --self-test-command
          payload="$(printf '%s' '{"path":"/tmp","home":"/tmp"}' | base64 | tr -d '\n')"
          build/portable-linux/Hi5CentralAgent --hi5-file-helper list "$payload" current | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"] and data["path"]=="/tmp"'
          build/portable-linux/Hi5CentralAgent --self-test | tee /tmp/hi5-agent-self-test.json
          python3 - <<'PY'
          import json
          with open('/tmp/hi5-agent-self-test.json') as f:
              data=json.load(f)
          assert data['platform']=='linux', data
          assert data['hostname'], data
          assert data['architecture'], data
          assert data['memory']['totalBytes'] > 0, data
          assert data['disk']['totalBytes'] > 0, data
          software=data.get('software', {})
          assert software.get('count', 0) == software.get('installed_apps', 0), software
          assert software.get('component_count', 0) >= software.get('count', 0), software
          assert software.get('hidden_system_components', 0) == software.get('component_count', 0) - software.get('count', 0), software
          for item in software.get('items', []):
              assert item.get('display_in_installed_software') is True, item
              assert item.get('system_component') is not True, item
              if item.get('essential') is True:
                  assert item.get('native_actionable') is not True, item
          for item in software.get('components', []):
              if item.get('essential') is True:
                  assert item.get('display_in_installed_software') is not True, item
                  assert item.get('native_actionable') is not True, item
          remote=data.get('capabilities', {}).get('remote_desktop_capabilities', {})
          assert remote.get('backend') == 'none', remote
          assert remote.get('headless') is True, remote
          assert remote.get('management_only') is True, remote
          assert remote.get('available') is False, remote
          PY
      - name: Package
        run: |
          mkdir -p dist/linux/installer/linux
          cp build/portable-linux/Hi5CentralAgent dist/linux/Hi5CentralAgent
          cp Agent/portable_agent/installer/linux/install.sh dist/linux/installer/linux/install.sh
          chmod +x dist/linux/Hi5CentralAgent dist/linux/installer/linux/install.sh
          tar -C dist/linux -czf dist/Hi5CentralAgent-linux-x64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-Agent-Linux-x64
          path: dist/Hi5CentralAgent-linux-x64.tar.gz
          retention-days: 14
          if-no-files-found: error

  macos-build:
    name: macos-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Resolve native codec dependencies
        run: |
          for formula in openssl@3 libvpx aom; do
            if ! brew list "$formula" >/dev/null 2>&1; then
              brew install "$formula"
            fi
          done
          openssl_prefix="$(brew --prefix openssl@3)"
          vpx_prefix="$(brew --prefix libvpx)"
          aom_prefix="$(brew --prefix aom)"
          test -f "$vpx_prefix/lib/libvpx.a"
          test -f "$aom_prefix/lib/libaom.a"
          echo "OPENSSL_ROOT_DIR=$openssl_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$vpx_prefix/lib/pkgconfig:$aom_prefix/lib/pkgconfig:$openssl_prefix/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Configure native build
        run: |
          cmake -S Agent/portable_agent -B build/portable-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.3 \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.arch }}" \
            -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DHI5CENTRAL_AGENT_VERSION=0.3.${{ github.run_number }}
      - name: Build
        run: cmake --build build/portable-macos
      - name: Verify self-contained native binaries
        run: |
          echo "=== Agent dependencies ==="
          otool -L build/portable-macos/Hi5CentralAgent
          echo "=== Remote Helper dependencies ==="
          otool -L build/portable-macos/Hi5CentralRemoteHelper | tee /tmp/hi5-helper-otool.txt
          if grep -E '/(opt/homebrew|usr/local)/.*lib(ssl|crypto|vpx|aom).*\.dylib' /tmp/hi5-helper-otool.txt; then
            echo "Remote Helper must not depend on Homebrew OpenSSL/VPX/AOM dylibs." >&2
            exit 1
          fi
      - name: Runtime self-test
        run: |
          bash -n Agent/portable_agent/installer/macos/install.sh
          build/portable-macos/Hi5CentralAgent --version
          file build/portable-macos/Hi5CentralAgent
          file build/portable-macos/Hi5CentralRemoteHelper
          build/portable-macos/Hi5CentralAgent --self-test-command
          payload="$(printf '%s' '{"path":"/tmp","home":"/tmp"}' | base64 | tr -d '\n')"
          build/portable-macos/Hi5CentralAgent --hi5-file-helper list "$payload" current | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data["ok"] and data["path"]=="/tmp"'
          build/portable-macos/Hi5CentralAgent --self-test | tee /tmp/hi5-agent-self-test.json
          python3 - <<'PY'
          import json
          with open('/tmp/hi5-agent-self-test.json') as f:
              data=json.load(f)
          assert data['platform']=='macos', data
          assert data['hostname'], data
          assert data['architecture'], data
          assert data['memory']['totalBytes'] > 0, data
          assert data['disk']['totalBytes'] > 0, data
          remote=data.get('capabilities', {}).get('remote_desktop_capabilities', {})
          assert remote.get('backend') == 'macos_screencapturekit', remote
          assert remote.get('implementation_ready') is True, remote
          PY
      - name: Stage native binaries
        run: |
          mkdir -p dist/native
          cp build/portable-macos/Hi5CentralAgent dist/native/Hi5CentralAgent
          cp build/portable-macos/Hi5CentralRemoteHelper dist/native/Hi5CentralRemoteHelper
      - uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-Agent-macOS-${{ matrix.arch }}
          path: dist/native/
          retention-days: 14
          if-no-files-found: error

  macos-package:
    name: macos-universal-package
    needs: macos-build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Hi5Central-Agent-macOS-arm64
          path: artifacts/arm64
      - uses: actions/download-artifact@v4
        with:
          name: Hi5Central-Agent-macOS-x86_64
          path: artifacts/x86_64
      - name: Create universal binaries
        run: |
          mkdir -p dist/macos/installer/macos
          mkdir -p "dist/macos/Hi5Central Remote Helper.app/Contents/MacOS"
          lipo -create artifacts/arm64/Hi5CentralAgent artifacts/x86_64/Hi5CentralAgent -output dist/macos/Hi5CentralAgent
          lipo -create artifacts/arm64/Hi5CentralRemoteHelper artifacts/x86_64/Hi5CentralRemoteHelper -output "dist/macos/Hi5Central Remote Helper.app/Contents/MacOS/Hi5CentralRemoteHelper"
          file dist/macos/Hi5CentralAgent
          file "dist/macos/Hi5Central Remote Helper.app/Contents/MacOS/Hi5CentralRemoteHelper"
          lipo dist/macos/Hi5CentralAgent -verify_arch arm64 x86_64
          lipo "dist/macos/Hi5Central Remote Helper.app/Contents/MacOS/Hi5CentralRemoteHelper" -verify_arch arm64 x86_64
      - name: Package and sign
        run: |
          cp Agent/portable_agent/installer/macos/remote-helper-Info.plist "dist/macos/Hi5Central Remote Helper.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 0.3.${{ github.run_number }}" "dist/macos/Hi5Central Remote Helper.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "dist/macos/Hi5Central Remote Helper.app/Contents/Info.plist"
          codesign --force --sign - dist/macos/Hi5CentralAgent
          codesign --force --deep --sign - "dist/macos/Hi5Central Remote Helper.app"
          codesign --verify --deep --strict "dist/macos/Hi5Central Remote Helper.app"
          cp Agent/portable_agent/installer/macos/install.sh dist/macos/installer/macos/install.sh
          chmod +x dist/macos/Hi5CentralAgent "dist/macos/Hi5Central Remote Helper.app/Contents/MacOS/Hi5CentralRemoteHelper" dist/macos/installer/macos/install.sh
          bash -n dist/macos/installer/macos/install.sh
          tar -C dist/macos -czf dist/Hi5CentralAgent-macOS-universal.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-Agent-macOS-universal
          path: dist/Hi5CentralAgent-macOS-universal.tar.gz
          retention-days: 14
          if-no-files-found: error