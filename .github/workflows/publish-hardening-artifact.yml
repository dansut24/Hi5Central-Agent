name: Publish selected hardening artifact

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/publish-hardening-artifact.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_RUN_ID: "35539948408"
      SOURCE_BUILD: "0.1.87"
      SOURCE_COMMIT: "adb90444a90a4b60bf5282b79d9089ca5e78c3f1"
      PATCH_HOST_VERSION: "0.2.10"
    steps:
      - name: Download selected Agent artifact
        uses: actions/download-artifact@v4
        with:
          name: Hi5Central-Agent-Windows
          path: ${{ runner.temp }}/agent-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Checkout build-output
        uses: actions/checkout@v4
        with:
          ref: build-output
          path: output

      - name: Publish versioned hardening build
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/agent-artifact"
          dst="output/hardening/${SOURCE_BUILD}"
          mkdir -p "$dst"
          cp "$src/dist/installer/Hi5CentralAgentSetup.exe" "$dst/"
          cp "$src/build/Release/Hi5CentralPatchHost.exe" "$dst/"
          sha256sum "$dst/Hi5CentralAgentSetup.exe" | awk '{print $1}' > "$dst/Hi5CentralAgentSetup.exe.sha256"
          sha256sum "$dst/Hi5CentralPatchHost.exe" | awk '{print $1}' > "$dst/Hi5CentralPatchHost.exe.sha256"
          cat > "$dst/build.json" <<JSON
          {"build":"${SOURCE_BUILD}","commit":"${SOURCE_COMMIT}","workflow_run":${SOURCE_RUN_ID},"patch_host_version":"${PATCH_HOST_VERSION}","channel":"agent-hardening-v2"}
          JSON
          cd output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "hardening/${SOURCE_BUILD}"
          git commit -m "Publish hardening build ${SOURCE_BUILD}"
          git push origin build-output
