name: Sync media memory auto 0.1.38

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - .github/workflows/sync-media-memory-auto-0.1.38.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0

      - name: Download and verify exact source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fL 'https://downloads.hi5central.com/bootstrap-agent-sync/media-memory-auto-0.1.38-0c28229.tar.gz' -o /tmp/hi5-0138.tar.gz
          echo 'f5665625e7f9523d487849a94e658b0b97d8682cc1242c4793f0bbb2c44241e3  /tmp/hi5-0138.tar.gz' | sha256sum -c -
          tar -xzf /tmp/hi5-0138.tar.gz -C .

      - name: Commit exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hi5Central Build Bot'
          git config user.email 'buildbot@hi5central.com'
          git add \
            .github/workflows/windows-installers.yml \
            Agent/chatpass_agent/CMakeLists.txt \
            Agent/chatpass_agent/installer/windows/Build-AgentInstaller.ps1 \
            Agent/chatpass_agent/installer/windows/Hi5CentralAgentSetup.iss \
            Agent/chatpass_agent/installer/windows/Hi5TechAgentSetup.iss \
            Agent/chatpass_agent/src/codec_capabilities.h \
            Agent/chatpass_agent/src/media_host_entry.cpp \
            Agent/chatpass_agent/src/media_host_main.cpp \
            Agent/chatpass_agent/src/platform/windows/windows_codec.cpp \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/remote_host_main.cpp \
            Agent/chatpass_agent/src/webrtc_sender.cpp \
            Agent/chatpass_agent/src/webrtc_sender.h
          if git diff --cached --quiet; then
            echo 'Checkpoint already applied.'
            exit 0
          fi
          git commit -m 'Reduce media RAM and make Auto codec adaptive'
          git push origin HEAD:agent-hardening-v2
