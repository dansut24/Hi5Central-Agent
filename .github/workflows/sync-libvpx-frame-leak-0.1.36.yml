name: Sync libvpx frame leak fix 0.1.36

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - .github/workflows/sync-libvpx-frame-leak-0.1.36.yml

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0

      - name: Download exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.hi5central.com/bootstrap-agent-sync/libvpx-frame-leak-0.1.36-0b361aa.tar.gz -o /tmp/source.tar.gz
          echo "04e424919f4207b3f812b92cfcb571554c3e2376bd353a6fd14d480aee0b96c3  /tmp/source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C .

      - name: Commit exact libvpx fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Agent/chatpass_agent/src/vp8_encoder.cpp \
            Agent/chatpass_agent/src/vp9_vpx_encoder.cpp
          if git diff --cached --quiet; then
            echo "Source already synchronized"
            exit 0
          fi
          git commit -m "Fix libvpx per-frame image leak"
          git push origin HEAD:agent-hardening-v2
