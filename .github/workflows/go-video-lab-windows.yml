name: Go Video Lab - Windows x64
on:
  pull_request:
    paths:
      - 'Agent/go-streamlab/**'
      - '.github/workflows/go-video-lab-windows.yml'
  push:
    branches: ['feature/go-agent-comparison-pilot-20261117']
    paths:
      - 'Agent/go-streamlab/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Agent/go-streamlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: Agent/go-streamlab/go.sum
      - name: Run IVF and transport tests
        run: go test -count=1 ./...
      - name: Build Windows streaming host
        run: go build -trimpath -ldflags "-s -w" -o Hi5CentralGoStreamLab-Win64.exe ./cmd/go-streamlab
      - name: Package Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-Go-VideoLab-Win64
          path: Agent/go-streamlab/Hi5CentralGoStreamLab-Win64.exe
          if-no-files-found: error
