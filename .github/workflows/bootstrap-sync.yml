name: Bootstrap hardened source sync

on:
  push:
    branches:
      - hardening-mobile-viewer
    paths:
      - ".github/workflows/bootstrap-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated source snapshot
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/agent-hardening-source.zip \
            -o /tmp/agent-hardening-source.zip
          echo "d80e5d3423db5a153d55400d7e31987fb93959098652d69d13ec21229df2b25e  /tmp/agent-hardening-source.zip" | sha256sum -c -

      - name: Replace source tree while preserving bootstrap workflow
        shell: bash
        run: |
          mkdir -p /tmp/agent-hardening-source
          unzip -q /tmp/agent-hardening-source.zip -d /tmp/agent-hardening-source
          cp .github/workflows/bootstrap-sync.yml /tmp/bootstrap-sync.yml
          rm -rf /tmp/agent-hardening-source/.github/workflows
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/agent-hardening-source/. .
          mkdir -p .github/workflows
          cp /tmp/bootstrap-sync.yml .github/workflows/bootstrap-sync.yml
          git add -A
          git status --short

      - name: Commit and push synced source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync hardened Agent source"
          git push origin HEAD:hardening-mobile-viewer
