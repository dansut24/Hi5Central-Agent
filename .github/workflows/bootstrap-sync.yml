name: Bootstrap hardened source sync

on:
  push:
    branches:
      - hardening-mobile-viewer
    paths:
      - ".github/workflows/bootstrap-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated source snapshot
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/agent-hardening-source.zip \
            -o /tmp/agent-hardening-source.zip
          echo "abbd7af5bad3957e94a7ff7280a0084a10210d4fca1c8a82a37b5bd09a337b05  /tmp/agent-hardening-source.zip" | sha256sum -c -

      - name: Replace source tree while preserving workflows
        shell: bash
        run: |
          mkdir -p /tmp/agent-hardening-source
          unzip -q /tmp/agent-hardening-source.zip -d /tmp/agent-hardening-source
          cp -a .github/workflows /tmp/existing-workflows
          rm -rf /tmp/agent-hardening-source/.github/workflows
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/agent-hardening-source/. .
          mkdir -p .github
          rm -rf .github/workflows
          cp -a /tmp/existing-workflows .github/workflows
          git add -A
          git status --short

      - name: Commit and push synced source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync Agent enrollment and reconnect fix"
          git push origin HEAD:hardening-mobile-viewer
