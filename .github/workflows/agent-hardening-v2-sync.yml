name: Agent hardening v2 source sync

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write
  actions: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated VPS snapshot
        shell: bash
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/agent-hardening-v2-ddf2f67.tar.gz \
            -o /tmp/agent-hardening-v2.tar.gz
          echo "cc083b670c14dc0e6ae382c2f3d5b99d042422405fe4a215ce2f329ca3da7ad8  /tmp/agent-hardening-v2.tar.gz" | sha256sum -c -

      - name: Replace branch with validated snapshot
        shell: bash
        run: |
          rm -rf /tmp/agent-hardening-v2
          mkdir -p /tmp/agent-hardening-v2
          tar -xzf /tmp/agent-hardening-v2.tar.gz -C /tmp/agent-hardening-v2
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/agent-hardening-v2/. .
          git add -A
          git status --short

      - name: Commit and push snapshot
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Sync native chat compiler fix"
            git push origin HEAD:agent-hardening-v2
          fi

      - name: Dispatch Windows validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/windows-installers.yml/dispatches \
            -d '{"ref":"agent-hardening-v2"}'
