name: Sync Winlogon lifecycle latch checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify Winlogon lifecycle latch snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/winlogon-latch-f269b6e.tar.gz \
            -o /tmp/winlogon-latch-f269b6e.tar.gz
          echo "3f0968bac9856ed1ae35c8984b6b493e4ca929a1ed8896544bcd6c324e52af75  /tmp/winlogon-latch-f269b6e.tar.gz" | sha256sum -c -

      - name: Apply exact changed file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/winlogon-latch
          tar -xzf /tmp/winlogon-latch-f269b6e.tar.gz -C /tmp/winlogon-latch
          cp -a /tmp/winlogon-latch/. .
          rm -f Agent/.ci-winlogon-stable-5ff24ef
          git add -A
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync Winlogon lifecycle latch checkpoint"
          git push origin HEAD:agent-hardening-v2
