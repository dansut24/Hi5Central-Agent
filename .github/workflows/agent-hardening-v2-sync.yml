name: Sync session controls and process split checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/rmm-session-controls-process-split-57a7aa7.tar.gz \
            -o /tmp/rmm-session-controls-process-split-57a7aa7.tar.gz
          echo "92970c24ca2e37360dcc3de722d396e99e7daebf28726c8eec119a2e70d196f5  /tmp/rmm-session-controls-process-split-57a7aa7.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rmm-session-controls-process-split
          tar -xzf /tmp/rmm-session-controls-process-split-57a7aa7.tar.gz -C /tmp/rmm-session-controls-process-split
          cp -a /tmp/rmm-session-controls-process-split/. .
          git add \
            .github/workflows/windows-installers.yml \
            Agent/chatpass_agent/CMakeLists.txt \
            Agent/chatpass_agent/installer/windows/Build-AgentInstaller.ps1 \
            Agent/chatpass_agent/installer/windows/Hi5CentralAgentSetup.iss \
            Agent/chatpass_agent/installer/windows/Hi5TechAgentSetup.iss \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/remote_host_main.cpp \
            Agent/chatpass_agent/src/streamer_main.cpp \
            Agent/chatpass_agent/src/ui/native_chat_window.cpp \
            Agent/chatpass_agent/src/ui/native_chat_window.h \
            Agent/chatpass_agent/src/user_main.cpp \
            Viewer/chatpass_viewer/src/app/viewer_app.cpp \
            Viewer/chatpass_viewer/web/renderer.js
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Split remote helpers and fix session controls"
          git push origin HEAD:agent-hardening-v2
