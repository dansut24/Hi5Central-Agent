name: Sync complete codec checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/codec-complete-f9f2369.tar.gz \
            -o /tmp/codec-complete-f9f2369.tar.gz
          echo "0860ea6f5ae789d8959029d9065ff135ac4808213c4e355bec88e9ba4e524182  /tmp/codec-complete-f9f2369.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/codec-complete-f9f2369
          tar -xzf /tmp/codec-complete-f9f2369.tar.gz -C /tmp/codec-complete-f9f2369
          cp -a /tmp/codec-complete-f9f2369/. .
          git add \
            Agent/chatpass_agent/CMakeLists.txt \
            Agent/chatpass_agent/src/av1_mf_encoder.cpp \
            Agent/chatpass_agent/src/codec_capabilities.cpp \
            Agent/chatpass_agent/src/codec_capabilities.h \
            Agent/chatpass_agent/src/codec_policy.cpp \
            Agent/chatpass_agent/src/h264_mf_encoder.cpp \
            Agent/chatpass_agent/src/h265_mf_encoder.cpp \
            Agent/chatpass_agent/src/h265_mf_encoder.h \
            Agent/chatpass_agent/src/platform/windows/windows_codec.cpp \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/vp9_mf_encoder.cpp \
            Agent/chatpass_agent/src/vp9_vpx_encoder.cpp \
            Agent/chatpass_agent/src/vp9_vpx_encoder.h \
            Agent/chatpass_agent/src/webrtc_sender.cpp \
            Agent/chatpass_agent/src/webrtc_sender.h \
            Viewer/chatpass_viewer/web/renderer.js
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Complete adaptive remote video codec stack"
          git push origin HEAD:agent-hardening-v2
