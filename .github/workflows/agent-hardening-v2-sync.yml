name: Sync automation tray compile fix

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify tray compile fix snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/automation-tray-compile-fix-116d131.tar.gz \
            -o /tmp/automation-tray-compile-fix-116d131.tar.gz
          echo "da6b4f15124a41b8d6ec2b291220e65cf4b217f56a6f34349a77972891e49dfe  /tmp/automation-tray-compile-fix-116d131.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/automation-tray-compile-fix
          tar -xzf /tmp/automation-tray-compile-fix-116d131.tar.gz -C /tmp/automation-tray-compile-fix
          cp -a /tmp/automation-tray-compile-fix/. .
          git add \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/ui/native_tray.cpp
          git status --short

      - name: Commit synced compile fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Fix Windows tray compilation"
          git push origin HEAD:agent-hardening-v2
