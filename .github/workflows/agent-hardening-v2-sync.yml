name: Agent hardening v2 source sync

on:
  push:
    branches: [agent-hardening-v2]
    paths: ['.github/workflows/agent-hardening-v2-sync.yml']

permissions:
  contents: write
  actions: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download validated VPS snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o /tmp/agent-hardening-v2.tar.gz https://downloads.hi5central.com/bootstrap-agent-sync/agent-hardening-v2-b49ba4e.tar.gz
          echo '7d791a59892333bc55ecb6367afb5effbaa91edfb73aa35f960552b9109322a4  /tmp/agent-hardening-v2.tar.gz' | sha256sum -c -
      - name: Replace branch with validated snapshot
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/agent-hardening-v2.tar.gz -C .
      - name: Commit and push snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Sync single-helper secure desktop experiment'
          git push origin HEAD:agent-hardening-v2
      - name: Dispatch Windows validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run windows-installers.yml --ref agent-hardening-v2
