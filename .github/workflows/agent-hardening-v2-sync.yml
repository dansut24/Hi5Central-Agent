name: Sync native support panel checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify native support panel snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/native-support-panel-deed331.tar.gz \
            -o /tmp/native-support-panel-deed331.tar.gz
          echo "afaa7dfcb6b0f06d163a014bf3d5c67030011884fe7d891f30f30752675d4420  /tmp/native-support-panel-deed331.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/native-support-panel
          tar -xzf /tmp/native-support-panel-deed331.tar.gz -C /tmp/native-support-panel
          cp -a /tmp/native-support-panel/. .
          git add Agent/chatpass_agent/CMakeLists.txt \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/ui/native_banner.cpp \
            Agent/chatpass_agent/src/ui/native_banner.h
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync native support panel compile fix"
          git push origin HEAD:agent-hardening-v2
