name: Sync Viewer codec badge

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact Viewer checkpoint
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/viewer-codec-badge-HEAD.tar.gz \
            -o /tmp/viewer-codec-badge.tar.gz
          echo "568a8e9b7d28fd09f25b6b082201ba2892189aea81115cc6d29f63418c83e674  /tmp/viewer-codec-badge.tar.gz" | sha256sum -c -

      - name: Apply exact Viewer files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/viewer-codec-badge
          tar -xzf /tmp/viewer-codec-badge.tar.gz -C /tmp/viewer-codec-badge
          cp -a /tmp/viewer-codec-badge/. .
          git add \
            Viewer/chatpass_viewer/web/index.html \
            Viewer/chatpass_viewer/web/renderer.js
          git status --short

      - name: Commit synced Viewer checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No Viewer source changes to sync."
            exit 0
          fi
          git commit -m "Show negotiated codec in Viewer"
          git push origin HEAD:agent-hardening-v2
