name: Sync chat files CAD checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify chat files CAD snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/chat-files-cad-a9e4b47.tar.gz \
            -o /tmp/chat-files-cad-a9e4b47.tar.gz
          echo "81ff593a03a0f7b340bb1339c2dcf1283f8f01d6a981353df94e7fca15347ade  /tmp/chat-files-cad-a9e4b47.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/chat-files-cad
          tar -xzf /tmp/chat-files-cad-a9e4b47.tar.gz -C /tmp/chat-files-cad
          cp -a /tmp/chat-files-cad/. .
          git add \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/ui/native_chat_window.cpp \
            Agent/chatpass_agent/src/ui/native_chat_window.h \
            Viewer/chatpass_viewer/src/app/viewer_app.cpp \
            Viewer/chatpass_viewer/web/file_browser.html \
            Viewer/chatpass_viewer/web/renderer.js
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync chat files CAD checkpoint"
          git push origin HEAD:agent-hardening-v2
