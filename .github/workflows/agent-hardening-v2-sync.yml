name: Sync persistent handoff checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify persistent handoff snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/persistent-handoff-a6e432e.tar.gz \
            -o /tmp/persistent-handoff-a6e432e.tar.gz
          echo "35c24d30b31fc6c661a7bb446a6a206dd897d3d93e47de4bf9ad73c5641c3bfd  /tmp/persistent-handoff-a6e432e.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/persistent-handoff
          tar -xzf /tmp/persistent-handoff-a6e432e.tar.gz -C /tmp/persistent-handoff
          cp -a /tmp/persistent-handoff/. .
          rm -f Agent/.ci-vp9-quality-1b37598
          git add -A
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync persistent Windows session handoff checkpoint"
          git push origin HEAD:agent-hardening-v2
