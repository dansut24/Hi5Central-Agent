name: Sync RMM polish and audio checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify RMM polish snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/rmm-polish-audio-e7727e1.tar.gz \
            -o /tmp/rmm-polish-audio-e7727e1.tar.gz
          echo "1bd2f4dbcee49d70c38819af481506413b83d3fd0efe703ae5fe8207e32302ee  /tmp/rmm-polish-audio-e7727e1.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/rmm-polish-audio
          tar -xzf /tmp/rmm-polish-audio-e7727e1.tar.gz -C /tmp/rmm-polish-audio
          cp -a /tmp/rmm-polish-audio/. .
          git add \
            Agent/chatpass_agent/CMakeLists.txt \
            Agent/chatpass_agent/vcpkg.json \
            Agent/chatpass_agent/src/ipc/input_pipe.h \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/platform/windows/wasapi_loopback.cpp \
            Agent/chatpass_agent/src/platform/windows/wasapi_loopback.h \
            Agent/chatpass_agent/src/streamer_main.cpp \
            Agent/chatpass_agent/src/ui/native_banner.cpp \
            Agent/chatpass_agent/src/ui/native_chat_window.cpp \
            Agent/chatpass_agent/src/ui/native_chat_window.h \
            Agent/chatpass_agent/src/ui/native_tray.cpp \
            Agent/chatpass_agent/src/webrtc_sender.cpp \
            Agent/chatpass_agent/src/webrtc_sender.h \
            Viewer/chatpass_viewer/web/index.html \
            Viewer/chatpass_viewer/web/renderer.js
          git status --short

      - name: Commit synced RMM polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Polish tray remote controls and add audio"
          git push origin HEAD:agent-hardening-v2
