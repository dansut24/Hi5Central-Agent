name: Sync console handoff stability checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify console handoff stability snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/handoff-stability-178101f.tar.gz \
            -o /tmp/handoff-stability-178101f.tar.gz
          echo "8fdc1feed9ddc96b965c176a94ffe54c3a49f863e0f5be747d3c3364342bf678  /tmp/handoff-stability-178101f.tar.gz" | sha256sum -c -

      - name: Apply exact changed file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/handoff-stability
          tar -xzf /tmp/handoff-stability-178101f.tar.gz -C /tmp/handoff-stability
          cp -a /tmp/handoff-stability/. .
          git add Agent/chatpass_agent/src/platform/windows/windows_service.cpp
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync console handoff stability checkpoint"
          git push origin HEAD:agent-hardening-v2
