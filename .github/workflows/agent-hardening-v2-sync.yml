name: Sync automation tray checkpoint

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/agent-hardening-v2-sync.yml"

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify automation tray snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            https://downloads.hi5central.com/bootstrap-agent-sync/automation-tray-4c856f4.tar.gz \
            -o /tmp/automation-tray-4c856f4.tar.gz
          echo "730cac6e666d78aa426ea184ff99a965ff9146cd88b56020ba5d08e97b6a0770  /tmp/automation-tray-4c856f4.tar.gz" | sha256sum -c -

      - name: Apply exact changed files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/automation-tray
          tar -xzf /tmp/automation-tray-4c856f4.tar.gz -C /tmp/automation-tray
          cp -a /tmp/automation-tray/. .
          git add \
            Agent/chatpass_agent/CMakeLists.txt \
            Agent/chatpass_agent/src/main.cpp \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp \
            Agent/chatpass_agent/src/ui/native_tray.cpp \
            Agent/chatpass_agent/src/ui/native_tray.h
          git status --short

      - name: Commit synced checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No source changes to sync."
            exit 0
          fi
          git commit -m "Sync policy controlled tray self service"
          git push origin HEAD:agent-hardening-v2
