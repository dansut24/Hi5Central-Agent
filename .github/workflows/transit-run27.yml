name: Transit run 27 installers

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/transit-run27.yml"

permissions:
  contents: write
  actions: read

jobs:
  transit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download run 27 artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 35134822172
          path: /tmp/hi5-run27

      - name: Prepare exact installers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hi5-transit
          agent="$(find /tmp/hi5-run27 -type f -name 'Hi5CentralAgentSetup.exe' -print -quit)"
          viewer="$(find /tmp/hi5-run27 -type f -name 'Hi5CentralViewerSetup.exe' -print -quit)"
          test -n "$agent" && test -f "$agent"
          test -n "$viewer" && test -f "$viewer"
          cp "$agent" /tmp/hi5-transit/Hi5CentralAgentSetup.exe
          cp "$viewer" /tmp/hi5-transit/Hi5CentralViewerSetup.exe
          sha256sum /tmp/hi5-transit/*.exe

      - name: Publish temporary prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete transit-0.1.27 --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create transit-0.1.27 \
            /tmp/hi5-transit/Hi5CentralAgentSetup.exe \
            /tmp/hi5-transit/Hi5CentralViewerSetup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Temporary 0.1.27 transit" \
            --notes "Temporary transfer assets for verified run 27 staging."
