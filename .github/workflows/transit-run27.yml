name: Cleanup run 27 transit

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/transit-run27.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove temporary prerelease and tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete transit-0.1.27 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
