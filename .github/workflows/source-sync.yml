name: Sync VPS source snapshot

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - .github/workflows/source-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0

      - name: Download and verify VPS snapshot
        shell: bash
        run: |
          set -euo pipefail
          url='https://downloads.hi5central.com/agent/source-sync/agent-hardening-v2-1b37598.tar.gz'
          expected='2e2f64c51c0f7af821296167a0fb45a9e0af60db9bae62fe334c1acc5f049812'
          curl -fL "$url" -o /tmp/hi5central-source.tar.gz
          echo "$expected  /tmp/hi5central-source.tar.gz" | sha256sum -c -
          rm -rf /tmp/hi5central-source
          mkdir -p /tmp/hi5central-source
          tar -xzf /tmp/hi5central-source.tar.gz -C /tmp/hi5central-source

      - name: Replace branch with verified snapshot
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/hi5central-source/. .
          git config user.name 'Hi5Central Source Sync'
          git config user.email 'source-sync@hi5central.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Snapshot already matches branch.'
            exit 0
          fi
          git commit -m 'Sync VP9 quality fix from VPS snapshot'
          git push origin HEAD:agent-hardening-v2
