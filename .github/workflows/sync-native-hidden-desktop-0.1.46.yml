name: Sync native hidden desktop 0.1.46

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-native-hidden-desktop-0.1.46.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/native-hidden-desktop-0.1.46-b943ef6.tar.gz -O /tmp/native-hidden-desktop.tar.gz
          echo "a8d1b52ce11e5ccb809b6e41000d2dd6f4609ec16d843a00f567e45674fe8822  /tmp/native-hidden-desktop.tar.gz" | sha256sum -c -
          tar -xzf /tmp/native-hidden-desktop.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/CMakeLists.txt Agent/chatpass_agent/src/backstage/backstage_host.cpp Agent/chatpass_agent/src/ipc/session_launcher.cpp Agent/chatpass_agent/src/ipc/session_launcher.h Agent/chatpass_agent/src/platform/windows/windows_service.cpp
          if git diff --cached --quiet; then
            echo "Source already synchronized"
            exit 0
          fi
          git commit -m "Add private Windows desktop Background proof [skip ci]"
          git push origin HEAD:agent-hardening-v2
