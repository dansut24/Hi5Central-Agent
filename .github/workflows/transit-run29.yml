name: Cleanup run 29 transit

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/transit-run29.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove temporary prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete transit-0.1.29-20260916 --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
