name: Tenant-aware Agent installers

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Persistent Hi5Central Agent deployment UUID
        required: true
        type: string
      api_base:
        description: Hi5Central API base URL
        required: true
        default: https://api.hi5central.com
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: tenant-installer-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      API_BASE: ${{ inputs.api_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment ID
        shell: pwsh
        run: |
          if ($env:DEPLOYMENT_ID -notmatch '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$') {
            throw "Invalid deployment UUID."
          }

      - name: Fetch deployment build credential
        shell: pwsh
        run: |
          $tokenResponse = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=hi5central-tenant-installer"
          $bootstrap = Invoke-RestMethod -Headers @{ Authorization = "Bearer $($tokenResponse.value)" } -Uri "$env:API_BASE/api/v1/agent/installer-builds/$env:DEPLOYMENT_ID/bootstrap"
          Write-Output "::add-mask::$($bootstrap.deploymentSecret)"
          "DEPLOYMENT_SECRET=$($bootstrap.deploymentSecret)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build tenant EXE
        shell: pwsh
        run: |
          $source = "Agent/tenant_installer/windows/Program.cs"
          $content = Get-Content -Raw $source
          $content = $content.Replace("__DEPLOYMENT_ID__", $env:DEPLOYMENT_ID)
          $content = $content.Replace("__DEPLOYMENT_SECRET__", $env:DEPLOYMENT_SECRET)
          $content = $content.Replace("__API_BASE__", $env:API_BASE.TrimEnd('/'))
          Set-Content -Path $source -Value $content -NoNewline -Encoding utf8
          dotnet publish Agent/tenant_installer/windows/Hi5CentralTenantInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows/publish
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item dist/windows/publish/Hi5CentralAgentTenantInstaller.exe dist/windows/Hi5CentralAgentTenant-Windows.exe

      - name: Build tenant MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $bootstrapExe = (Resolve-Path 'dist/windows/Hi5CentralAgentTenant-Windows.exe').Path
          wix build Agent/tenant_installer/windows/Package.wxs -arch x64 -d "BootstrapExe=$bootstrapExe" -o dist/windows/Hi5CentralAgentTenant-Windows.msi

      - name: Upload Windows installers
        shell: pwsh
        run: |
          $tokenResponse = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" } -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=hi5central-tenant-installer"
          $oidc = $tokenResponse.value
          $files = @(
            @{ Format = "exe"; Path = "dist/windows/Hi5CentralAgentTenant-Windows.exe" },
            @{ Format = "msi"; Path = "dist/windows/Hi5CentralAgentTenant-Windows.msi" }
          )
          foreach ($item in $files) {
            $sha = (Get-FileHash -Algorithm SHA256 $item.Path).Hash.ToLowerInvariant()
            Invoke-RestMethod -Method Put -Headers @{ Authorization = "Bearer $oidc"; "x-hi5-sha256" = $sha } -ContentType "application/octet-stream" -InFile $item.Path -Uri "$env:API_BASE/api/v1/agent/installer-builds/$env:DEPLOYMENT_ID/artifacts/$($item.Format)"
          }

  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      API_BASE: ${{ inputs.api_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment ID
        shell: bash
        run: |
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]

      - name: Fetch deployment build credential
        shell: bash
        run: |
          oidc="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hi5central-tenant-installer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          bootstrap="$(curl -fsSL -H "Authorization: Bearer $oidc" "$API_BASE/api/v1/agent/installer-builds/$DEPLOYMENT_ID/bootstrap")"
          secret="$(printf '%s' "$bootstrap" | python3 -c 'import json,sys; print(json.load(sys.stdin)["deploymentSecret"])')"
          echo "::add-mask::$secret"
          printf 'DEPLOYMENT_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Render tenant bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("Agent/tenant_installer/macos/install.sh")
          s=p.read_text()
          s=s.replace("__DEPLOYMENT_ID__", os.environ["DEPLOYMENT_ID"])
          s=s.replace("__DEPLOYMENT_SECRET__", os.environ["DEPLOYMENT_SECRET"])
          s=s.replace("__API_BASE__", os.environ["API_BASE"].rstrip("/"))
          p.write_text(s)
          PY

      - name: Build APP PKG and DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/macos/Hi5CentralAgentTenant-macOS.app/Contents/MacOS"
          mkdir -p "dist/macos/Hi5CentralAgentTenant-macOS.app/Contents/Resources"
          cp Agent/tenant_installer/macos/Info.plist "dist/macos/Hi5CentralAgentTenant-macOS.app/Contents/Info.plist"
          cp Agent/tenant_installer/macos/AppLauncher.sh "dist/macos/Hi5CentralAgentTenant-macOS.app/Contents/MacOS/Hi5CentralAgentInstaller"
          cp Agent/tenant_installer/macos/install.sh "dist/macos/Hi5CentralAgentTenant-macOS.app/Contents/Resources/Install Hi5Central Agent.command"
          chmod +x "dist/macos/Hi5CentralAgentTenant-macOS.app/Contents/MacOS/Hi5CentralAgentInstaller" "dist/macos/Hi5CentralAgentTenant-macOS.app/Contents/Resources/Install Hi5Central Agent.command"
          codesign --force --deep --sign - "dist/macos/Hi5CentralAgentTenant-macOS.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/macos/Hi5CentralAgentTenant-macOS.app" "dist/macos/Hi5CentralAgentTenant-macOS.app.zip"

          mkdir -p dist/macos/pkg-scripts
          cp Agent/tenant_installer/macos/install.sh dist/macos/pkg-scripts/install.sh
          chmod +x dist/macos/pkg-scripts/install.sh
          cat > dist/macos/pkg-scripts/postinstall <<'EOF'
          #!/bin/bash
          set -euo pipefail
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          "$SCRIPT_DIR/install.sh"
          EOF
          chmod +x dist/macos/pkg-scripts/postinstall
          pkgbuild --nopayload --scripts dist/macos/pkg-scripts --identifier com.hi5central.agent.tenantinstaller --version 1.0 dist/macos/Hi5CentralAgentTenant-macOS.pkg

          mkdir -p dist/macos/dmg-root
          cp -R "dist/macos/Hi5CentralAgentTenant-macOS.app" dist/macos/dmg-root/
          cp "dist/macos/Hi5CentralAgentTenant-macOS.pkg" dist/macos/dmg-root/
          hdiutil create -volname "Hi5Central Agent" -srcfolder dist/macos/dmg-root -ov -format UDZO dist/macos/Hi5CentralAgentTenant-macOS.dmg

      - name: Upload macOS installers
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hi5central-tenant-installer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          upload() {
            local format="$1"
            local file="$2"
            local sha
            sha="$(shasum -a 256 "$file" | awk '{print $1}')"
            curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $oidc" -H "Content-Type: application/octet-stream" -H "x-hi5-sha256: $sha" --data-binary "@$file" "$API_BASE/api/v1/agent/installer-builds/$DEPLOYMENT_ID/artifacts/$format"
          }
          upload app dist/macos/Hi5CentralAgentTenant-macOS.app.zip
          upload pkg dist/macos/Hi5CentralAgentTenant-macOS.pkg
          upload dmg dist/macos/Hi5CentralAgentTenant-macOS.dmg

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      API_BASE: ${{ inputs.api_base }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment ID
        shell: bash
        run: |
          [[ "$DEPLOYMENT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]]

      - name: Fetch deployment build credential
        shell: bash
        run: |
          oidc="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hi5central-tenant-installer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          bootstrap="$(curl -fsSL -H "Authorization: Bearer $oidc" "$API_BASE/api/v1/agent/installer-builds/$DEPLOYMENT_ID/bootstrap")"
          secret="$(printf '%s' "$bootstrap" | python3 -c 'import json,sys; print(json.load(sys.stdin)["deploymentSecret"])')"
          echo "::add-mask::$secret"
          printf 'DEPLOYMENT_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"

      - name: Render tenant bootstrap
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path("Agent/tenant_installer/linux/install.sh")
          s=p.read_text()
          s=s.replace("__DEPLOYMENT_ID__", os.environ["DEPLOYMENT_ID"])
          s=s.replace("__DEPLOYMENT_SECRET__", os.environ["DEPLOYMENT_SECRET"])
          s=s.replace("__API_BASE__", os.environ["API_BASE"].rstrip("/"))
          p.write_text(s)
          PY

      - name: Build RUN DEB and RPM
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y rpm
          mkdir -p dist/linux
          cp Agent/tenant_installer/linux/install.sh dist/linux/Hi5CentralAgentTenant-Linux.run
          chmod +x dist/linux/Hi5CentralAgentTenant-Linux.run

          package_suffix="$(printf '%s' "$DEPLOYMENT_ID" | tr -d '-')"
          deb_root="dist/linux/deb-root"
          mkdir -p "$deb_root/DEBIAN" "$deb_root/usr/lib/hi5central/tenant-installer"
          cp Agent/tenant_installer/linux/install.sh "$deb_root/usr/lib/hi5central/tenant-installer/install.sh"
          chmod +x "$deb_root/usr/lib/hi5central/tenant-installer/install.sh"
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: hi5central-agent-bootstrap-$package_suffix
          Version: 1.0.0
          Section: admin
          Priority: optional
          Architecture: amd64
          Depends: curl, tar
          Maintainer: Hi5Central <hello@hi5central.com>
          Description: Tenant-bound Hi5Central Agent bootstrap
          EOF
          cat > "$deb_root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          /usr/lib/hi5central/tenant-installer/install.sh
          exit 0
          EOF
          chmod 0755 "$deb_root/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$deb_root" dist/linux/hi5central-agent-tenant_amd64.deb

          topdir="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$topdir"/BUILD "$topdir"/BUILDROOT "$topdir"/RPMS "$topdir"/SOURCES "$topdir"/SPECS "$topdir"/SRPMS
          cp Agent/tenant_installer/linux/install.sh "$topdir/SOURCES/install.sh"
          cat > "$topdir/SPECS/hi5central-agent.spec" <<EOF
          Name: hi5central-agent-bootstrap-$package_suffix
          Version: 1.0.0
          Release: 1
          Summary: Tenant-bound Hi5Central Agent bootstrap
          License: Proprietary
          BuildArch: x86_64
          Requires: curl
          Source0: install.sh

          %description
          Tenant-bound bootstrap installer for Hi5Central Agent.

          %prep

          %build

          %install
          mkdir -p %{buildroot}/usr/lib/hi5central/tenant-installer
          install -m 0755 %{SOURCE0} %{buildroot}/usr/lib/hi5central/tenant-installer/install.sh

          %post
          /usr/lib/hi5central/tenant-installer/install.sh

          %files
          /usr/lib/hi5central/tenant-installer/install.sh
          EOF
          rpmbuild -bb --define "_topdir $topdir" "$topdir/SPECS/hi5central-agent.spec"
          rpm_file="$(find "$topdir/RPMS" -type f -name '*.rpm' -print -quit)"
          cp "$rpm_file" dist/linux/hi5central-agent-tenant_x86_64.rpm

      - name: Upload Linux installers
        shell: bash
        run: |
          set -euo pipefail
          oidc="$(curl -fsSL -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=hi5central-tenant-installer" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          upload() {
            local format="$1"
            local file="$2"
            local sha
            sha="$(sha256sum "$file" | awk '{print $1}')"
            curl --fail-with-body -sS -X PUT -H "Authorization: Bearer $oidc" -H "Content-Type: application/octet-stream" -H "x-hi5-sha256: $sha" --data-binary "@$file" "$API_BASE/api/v1/agent/installer-builds/$DEPLOYMENT_ID/artifacts/$format"
          }
          upload run dist/linux/Hi5CentralAgentTenant-Linux.run
          upload deb dist/linux/hi5central-agent-tenant_amd64.deb
          upload rpm dist/linux/hi5central-agent-tenant_x86_64.rpm
