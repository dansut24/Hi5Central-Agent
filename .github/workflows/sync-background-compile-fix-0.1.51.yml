name: Sync Background compile fix 0.1.51

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-background-compile-fix-0.1.51.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/background-windowing-compile-fix-0.1.51-f84a682.tar.gz -O /tmp/background-compile-fix.tar.gz
          echo "30f49cd8a7302fc0350d50ebd236626784e90e50b8bbf70af39b5bd47535a959  /tmp/background-compile-fix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/background-compile-fix.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/backstage/backstage_host.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source already synchronized"
          else
            git commit -m "Fix Background Run dialog literals [skip ci]"
            git push origin HEAD:agent-hardening-v2
          fi
