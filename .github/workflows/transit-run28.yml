name: Cleanup run 28 transit

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/transit-run28.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete transit-run28 --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
