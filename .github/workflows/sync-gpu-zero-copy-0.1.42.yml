name: Sync GPU zero-copy 0.1.42

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-gpu-zero-copy-0.1.42.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0

      - name: Apply verified source archive
        shell: bash
        run: |
          set -euo pipefail
          url='https://downloads.hi5central.com/bootstrap-agent-sync/gpu-zero-copy-0.1.42-305cb8f.tar.gz'
          expected='bdfbe976f8ffb9edb2d6428ae272865fe147ec86f35f75e2de3587068a2ba26a'
          curl -fsSL "$url" -o /tmp/gpu-zero-copy.tar.gz
          echo "$expected  /tmp/gpu-zero-copy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gpu-zero-copy.tar.gz
          git diff --check
          git add \
            Agent/chatpass_agent/src/h264_mf_encoder.cpp \
            Agent/chatpass_agent/src/h264_mf_encoder.h \
            Agent/chatpass_agent/src/media_host_main.cpp \
            Agent/chatpass_agent/src/webrtc_sender.cpp \
            Agent/chatpass_agent/src/webrtc_sender.h
          if git diff --cached --quiet; then
            echo 'Source already synchronized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add zero-copy D3D11 H264 media path [skip ci]'
          git push origin HEAD:agent-hardening-v2
