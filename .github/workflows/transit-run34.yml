name: Transit run 34 cleanup

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - .github/workflows/transit-run34.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove temporary prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete transit-0.1.34-20260917 -R dansut24/Hi5Central-Agent --cleanup-tag -y
