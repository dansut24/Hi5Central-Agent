name: Cleanup run 31 transit

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/transit-run30.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove temporary prerelease and tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete transit-0.1.31-20260917 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
