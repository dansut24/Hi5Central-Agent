name: Transit run 31 codec artifacts

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/transit-run30.yml"

permissions:
  actions: read
  contents: write

jobs:
  transit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download exact run 31 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/agent /tmp/viewer
          gh run download 35189607021 --repo "$GITHUB_REPOSITORY" --name "Hi5Central-Agent-Windows" --dir /tmp/agent
          gh run download 35189607021 --repo "$GITHUB_REPOSITORY" --name "Hi5Central-Viewer-Windows" --dir /tmp/viewer
          find /tmp/agent -maxdepth 4 -type f -print
          find /tmp/viewer -maxdepth 4 -type f -print
          AGENT_EXE="$(find /tmp/agent -type f -iname '*Agent*Setup*.exe' | head -n 1)"
          VIEWER_EXE="$(find /tmp/viewer -type f -iname '*Viewer*Setup*.exe' | head -n 1)"
          test -n "$AGENT_EXE" && test -f "$AGENT_EXE"
          test -n "$VIEWER_EXE" && test -f "$VIEWER_EXE"
          cp "$AGENT_EXE" /tmp/Hi5CentralAgentSetup.exe
          cp "$VIEWER_EXE" /tmp/Hi5CentralViewerSetup.exe
          sha256sum /tmp/Hi5CentralAgentSetup.exe /tmp/Hi5CentralViewerSetup.exe

      - name: Create temporary prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete transit-0.1.31-20260917 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create transit-0.1.31-20260917 \
            /tmp/Hi5CentralAgentSetup.exe#Hi5CentralAgentSetup.exe \
            /tmp/Hi5CentralViewerSetup.exe#Hi5CentralViewerSetup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --target agent-hardening-v2 \
            --prerelease \
            --title "Temporary 0.1.31 transit" \
            --notes "Exact installers from Windows validation run 35189607021. Temporary transit only."
