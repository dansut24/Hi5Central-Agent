name: Rust StreamLab Native Windows
on:
  workflow_dispatch:
  push:
    branches:
      - 'experiment/rust-agent-*'
    paths:
      - 'RustStreamLab/**'
      - '.github/workflows/rust-streamlab-windows.yml'
  pull_request:
    paths:
      - 'RustStreamLab/**'
      - '.github/workflows/rust-streamlab-windows.yml'

jobs:
  rust-native-video-windows:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native libvpx using vcpkg
        shell: pwsh
        run: |
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT "vcpkg.exe"
          if (-not (Test-Path $vcpkg)) { throw "vcpkg not found" }
          & $vcpkg install libvpx:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg libvpx failed" }
          $root = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          "VPX_LIB_DIR=$root\lib" >> $env:GITHUB_ENV
          "VPX_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV
          "VPX_VERSION=1.15.0" >> $env:GITHUB_ENV
          "VPX_DYNAMIC=1" >> $env:GITHUB_ENV
          if (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll') {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          }
      - name: Verify tests
        shell: pwsh
        run: |
          cargo test --locked --manifest-path RustStreamLab/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust StreamLab tests failed' }
      - name: Build native Windows x64 Rust WebRTC host
        shell: pwsh
        run: |
          cargo build --release --locked --manifest-path RustStreamLab/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Rust StreamLab build failed' }
      - name: Bundle runtime DLL and run executable smoke check
        shell: pwsh
        run: |
          $out = 'RustStreamLab\target\release'
          $root = Join-Path $env:VCPKG_INSTALLATION_ROOT 'installed\x64-windows'
          $dlls = Get-ChildItem -Path (Join-Path $root 'bin') -Filter '*vpx*.dll' -ErrorAction SilentlyContinue
          foreach ($dll in $dlls) { Copy-Item $dll.FullName -Destination $out }
          & (Join-Path $out 'hi5-rust-streamlab.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Rust StreamLab executable smoke failed' }
          Get-FileHash -Algorithm SHA256 (Join-Path $out 'hi5-rust-streamlab.exe') | Out-File -FilePath (Join-Path $out 'SHA256.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: Hi5CentralRustStreamLab-Win64-native
          path: |
            RustStreamLab/target/release/hi5-rust-streamlab.exe
            RustStreamLab/target/release/*.dll
            RustStreamLab/target/release/SHA256.txt
          if-no-files-found: error
