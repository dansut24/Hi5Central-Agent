name: Isolated Streaming Lab Windows build

on:
  push:
    branches: [feature/streaming-core]
    paths:
      - 'StreamingLab/**'
      - '.github/workflows/streaming-lab-windows.yml'
  workflow_dispatch:

concurrency:
  group: streaming-lab-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-lab:
    runs-on: windows-2025
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install native streaming dependencies (static Windows)
        shell: pwsh
        run: |
          & C:\vcpkg\vcpkg.exe install "libdatachannel[srtp]:x64-windows-static" "libvpx:x64-windows-static" "libyuv:x64-windows-static" "nlohmann-json:x64-windows-static"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg streaming dependencies failed' }
      - name: Configure and build explicitly with MSVC (never MinGW)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual C++ compiler unavailable" }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          if (-not (Test-Path $devcmd)) { throw "VsDevCmd.bat missing" }
          $cmd = 'call "' + $devcmd + '" -arch=x64 -host_arch=x64 && cmake -S StreamingLab -B StreamingLab/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_CXX_COMPILER=cl && cmake --build StreamingLab/build --config Release --parallel 2'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'MSVC Streaming Lab configure/compile/link failed' }
          if (-not (Test-Path StreamingLab/build/dist/Hi5StreamingLab.exe)) { throw 'Missing Streaming Lab EXE' }
          Copy-Item StreamingLab/viewer.html StreamingLab/build/dist/viewer.html
          Copy-Item StreamingLab/Start-Hi5StreamingLab.cmd StreamingLab/build/dist/Start-Hi5StreamingLab.cmd
          Get-FileHash StreamingLab/build/dist/Hi5StreamingLab.exe -Algorithm SHA256 | Format-List
      - name: Ensure DXGI probe remains independent from production services
        shell: pwsh
        run: |
          $h = Get-Content StreamingLab/native/dxgi_capture.h -Raw
          if ($h -notmatch 'DuplicateOutput' -or $h -notmatch 'DXGI_ERROR_WAIT_TIMEOUT') {
            throw 'Interactive DXGI capture probe missing'
          }
          if ($h -match 'OpenInputDesktop|SetThreadDesktop|CreateService|Hi5CentralAgent') {
            throw 'Standalone DXGI capture must not manipulate security desktops or services'
          }
      - name: Validate website/relay JavaScript
        shell: pwsh
        run: |
          node --check StreamingLab/relay/server.js
          if ($LASTEXITCODE -ne 0) { throw 'Relay JS syntax failed' }
          $html = Get-Content StreamingLab/relay/remote-viewer.html -Raw
          if ($html -notmatch '(?s)<script>(.*?)</script>') { throw 'Remote viewer script missing' }
          $js = Join-Path $env:RUNNER_TEMP 'streaming-lab-remote-viewer.js'
          Set-Content $js -Value $Matches[1] -Encoding utf8
          node --check $js
          if ($LASTEXITCODE -ne 0) { throw 'Remote viewer JS syntax failed' }
      - name: Validate distribution files and local-only source policy
        shell: pwsh
        run: |
          $root='StreamingLab/build/dist'
          foreach($name in @('Hi5StreamingLab.exe','viewer.html','Start-Hi5StreamingLab.cmd')) {
            if(-not (Test-Path (Join-Path $root $name))) { throw "Missing $name" }
          }
          $text = Get-Content StreamingLab/native/main.cpp -Raw
          if($text -notmatch 'INADDR_LOOPBACK') { throw 'Lab is not bound to localhost' }
          if($text -match 'INADDR_ANY') { throw 'Unexpected public bind in lab source' }
          if($text -match 'api\.hi5central\.com|remote-sessions|device/enroll') {
            throw 'Unexpected production RMM dependency in lab source'
          }
          Write-Host 'Isolation checks passed'
      - uses: actions/upload-artifact@v4
        with:
          name: Hi5StreamingLab-Remote-Windows
          path: StreamingLab/build/dist/
          retention-days: 14
          if-no-files-found: error
