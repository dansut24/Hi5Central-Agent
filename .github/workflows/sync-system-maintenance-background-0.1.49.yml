name: Sync SYSTEM maintenance Background 0.1.49

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-system-maintenance-background-0.1.49.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/system-maintenance-background-0.1.49-74a9ece.tar.gz -O /tmp/system-maintenance-background.tar.gz
          echo "ff6e81360563c2d69062a7385d16d040fae6ab539e469d224503e9a6bfbf0f5c  /tmp/system-maintenance-background.tar.gz" | sha256sum -c -
          tar -xzf /tmp/system-maintenance-background.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/backstage/backstage_host.cpp Agent/chatpass_agent/src/platform/windows/windows_service.cpp Viewer/chatpass_viewer/web/renderer.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source already synchronized"
          else
            git commit -m "Build SYSTEM maintenance desktop for Background mode [skip ci]"
            git push origin HEAD:agent-hardening-v2
          fi
