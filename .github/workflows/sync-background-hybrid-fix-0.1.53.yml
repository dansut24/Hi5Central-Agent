name: Sync Background hybrid compile fix 0.1.53

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-background-hybrid-fix-0.1.53.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/background-hybrid-compile-fix-0.1.53-5b6a155.tar.gz -O /tmp/background-hybrid-fix.tar.gz
          echo "80748a7ab86e004b110f94a90016e230d23a2696b21b47011f2c38902f236799  /tmp/background-hybrid-fix.tar.gz" | sha256sum -c -
          tar -xzf /tmp/background-hybrid-fix.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/backstage/backstage_host.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source already synchronized"
          else
            git commit -m "Fix Background scheduler health state [skip ci]"
            git push origin HEAD:agent-hardening-v2
          fi
