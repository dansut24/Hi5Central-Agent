name: Publish checksum-verified Lenovo AV1 offline qualifier
on:
  push:
    branches:
      - feature/av1-hardware-qualification-20261029
    paths:
      - .github/workflows/publish-av1-lenovo-qualifier.yml
permissions:
  contents: write
  actions: read
jobs:
  release-qualifier:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve qualified Windows standalone libaom executable
        uses: actions/download-artifact@v4
        with:
          run-id: 41053464136
          artifact-ids: 12975886710
          github-token: ${{ github.token }}
          path: artifact
      - name: Check exact artifact hash; publish only executable
        shell: bash
        run: |
          set -euo pipefail
          cp artifact/windows-av1-lenovo-portable-qualifier/av1_lenovo_qualifier.exe AV1LenovoSoftwareQualifier-720p60.exe
          echo '2444f3c02bbcc36e396d091c08b4e376f1b90ad1d804d737d00ef9e123a6b8a4  AV1LenovoSoftwareQualifier-720p60.exe' | sha256sum -c -
          file AV1LenovoSoftwareQualifier-720p60.exe
      - name: Add to existing pre-release (no new production version)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view agent-1.0.213-test --repo "${{ github.repository }}" --json isPrerelease
          gh release upload agent-1.0.213-test AV1LenovoSoftwareQualifier-720p60.exe --repo "${{ github.repository }}" --clobber
