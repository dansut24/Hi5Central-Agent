name: Sync memory containment 0.1.35

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - .github/workflows/sync-memory-containment-0.1.35.yml

permissions:
  contents: write

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0

      - name: Download exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://downloads.hi5central.com/bootstrap-agent-sync/memory-containment-0.1.35-81ffe81.tar.gz -o /tmp/source.tar.gz
          echo "bb5e986dd1ce1fcfae19356317655b98d31ad4c67f32241dd772a06740a7b276  /tmp/source.tar.gz" | sha256sum -c -
          tar -xzf /tmp/source.tar.gz -C .

      - name: Commit exact containment source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Agent/chatpass_agent/src/av1_mf_encoder.cpp \
            Agent/chatpass_agent/src/vp9_mf_encoder.cpp \
            Agent/chatpass_agent/src/h264_mf_encoder.cpp \
            Agent/chatpass_agent/src/h265_mf_encoder.cpp \
            Agent/chatpass_agent/src/webrtc_sender.cpp \
            Agent/chatpass_agent/src/platform/windows/windows_service.cpp
          if git diff --cached --quiet; then
            echo "Source already synchronized"
            exit 0
          fi
          git commit -m "Contain agent memory growth and secure host restarts"
          git push origin HEAD:agent-hardening-v2
