name: Sync native hidden desktop 0.1.47

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-native-hidden-desktop-0.1.47.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/native-hidden-desktop-0.1.47-83fbf1e.tar.gz -O /tmp/native-hidden-desktop.tar.gz
          echo "75a6d0a83b8cba0c7a26f69ff4c2f64889f11a7edc0c693bb7f916b78cb97e21  /tmp/native-hidden-desktop.tar.gz" | sha256sum -c -
          tar -xzf /tmp/native-hidden-desktop.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/backstage/backstage_host.cpp Agent/chatpass_agent/src/ipc/session_launcher.cpp Agent/chatpass_agent/src/ipc/session_launcher.h
          if git diff --cached --quiet; then
            echo "Source already synchronized"
            exit 0
          fi
          git commit -m "Fix private desktop app launch elevation split [skip ci]"
          git push origin HEAD:agent-hardening-v2
