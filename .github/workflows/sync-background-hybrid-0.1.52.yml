name: Sync Background hybrid 0.1.52

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-background-hybrid-0.1.52.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/background-hybrid-0.1.52-a96e35d.tar.gz -O /tmp/background-hybrid.tar.gz
          echo "359ef1088392e53507fec0a745272f4c7434a284604cd512009059edc867a9dd  /tmp/background-hybrid.tar.gz" | sha256sum -c -
          tar -xzf /tmp/background-hybrid.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/backstage/backstage_host.cpp Agent/chatpass_agent/src/platform/windows/windows_service.cpp
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Source already synchronized"
          else
            git commit -m "Make Background desktop responsive and hybrid [skip ci]"
            git push origin HEAD:agent-hardening-v2
          fi
