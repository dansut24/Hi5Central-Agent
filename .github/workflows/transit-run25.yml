name: Cleanup run 25 transit

on:
  push:
    branches:
      - agent-hardening-v2
    paths:
      - ".github/workflows/transit-run25.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove temporary prerelease and tag
        shell: bash
        run: |
          set -euo pipefail
          gh release delete transit-0.1.25 --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag
