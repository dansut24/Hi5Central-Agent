name: Windows Deep Inventory Source Check

on:
  pull_request:
    paths:
      - 'Agent/chatpass_agent/src/platform/windows/windows_inventory.cpp'
      - 'Agent/chatpass_agent/src/platform/windows/windows_service.cpp'
      - 'Agent/chatpass_agent/src/inventory/inventory_snapshot.h'
      - '.github/workflows/windows-inventory-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-inventory:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install inventory JSON compile dependency
        shell: pwsh
        run: |
          & C:\vcpkg\vcpkg.exe install nlohmann-json:x64-windows-static
          if ($LASTEXITCODE -ne 0) { throw 'Windows inventory JSON dependency unavailable' }
      - name: Compile actual shipping Windows inventory collector
        shell: pwsh
        run: |
          $vswhere = Join-Path (Get-Item 'Env:ProgramFiles(x86)').Value 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'VS C++ build tools unavailable' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $cmd = 'call "' + $devcmd + '" -arch=x64 -host_arch=x64 && cl /nologo /std:c++17 /EHsc /W3 /DNOMINMAX /DWIN32_LEAN_AND_MEAN /I C:\vcpkg\installed\x64-windows-static\include /I Agent/chatpass_agent/src /c Agent/chatpass_agent/src/platform/windows/windows_inventory.cpp /Fodist\windows_inventory.obj'
          cmd.exe /d /s /c $cmd
          if ($LASTEXITCODE -ne 0) { throw 'Actual Windows inventory source compile failed' }
          if (-not (Test-Path dist/windows_inventory.obj)) { throw 'Inventory object missing' }
      - name: Parse embedded PowerShell inventory script
        shell: pwsh
        run: |
          $text = Get-Content 'Agent/chatpass_agent/src/platform/windows/windows_inventory.cpp' -Raw
          $start = $text.IndexOf('json DeepHardwareInventory()')
          if ($start -lt 0) { throw 'Missing deep inventory function' }
          $begin = $text.IndexOf('R"PS(', $start)
          $finish = $text.IndexOf(')PS", json::object());', $begin)
          if ($begin -lt 0 -or $finish -lt $begin) { throw 'Could not find PowerShell script boundaries' }
          $script = $text.Substring($begin + 5, $finish - ($begin + 5))
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell inventory script has syntax errors'
          }
          $required = @(
            'memory_modules','motherboard','physical_disks','monitors','drivers','problem_devices',
            'printers','usb_devices','installed_hotfixes','windows_licensing','reboot_state',
            'startup_items','scheduled_tasks','local_users','local_groups','optional_features',
            'power_plan','network_profiles','network_configurations','wifi_interfaces',
            'default_routes','directory_join','machine_certificates','virtualization',
            'battery_deep','deep_inventory_sections'
          )
          foreach ($key in $required) {
            if (-not $script.Contains($key)) { throw "Inventory result missing required $key" }
          }
          Write-Host "Deep Windows inventory PowerShell parsed and required payload keys present"
      - name: Verify explicit and scheduled deep inventory entry points
        shell: pwsh
        run: |
          $collector = Get-Content 'Agent/chatpass_agent/src/platform/windows/windows_inventory.cpp' -Raw
          $service = Get-Content 'Agent/chatpass_agent/src/platform/windows/windows_service.cpp' -Raw
          foreach ($required in @('8 * 60 * 60', 'deep-inventory-last-success.txt', 'deep_inventory_status', 'battery_deep')) {
            if (-not $collector.Contains($required)) { throw "Collector is missing $required" }
          }
          foreach ($required in @('inventory.deep.scan', 'deep_scan_deferred', 'SendInventorySnapshotSafe(ident, false, true)')) {
            if (-not $service.Contains($required)) { throw "Agent service is missing $required" }
          }
          Write-Host 'Eight-hour Agent-local deep scans and manual scan entry point are present'

      - name: Execute the real deep inventory script with Windows PowerShell 5.1
        shell: pwsh
        run: |
          # The actual Windows interpreter executes the embedded script, not just its parser.
          $text = Get-Content 'Agent/chatpass_agent/src/platform/windows/windows_inventory.cpp' -Raw
          $start = $text.IndexOf('json DeepHardwareInventory()')
          $begin = $text.IndexOf('R"PS(', $start)
          $finish = $text.IndexOf(')PS", json::object());', $begin)
          if ($start -lt 0 -or $begin -lt 0 -or $finish -le $begin) { throw 'Embedded inventory script not found' }
          $script = '$ProgressPreference = "SilentlyContinue"' + [Environment]::NewLine + '$ErrorActionPreference = "SilentlyContinue"' + [Environment]::NewLine + $text.Substring($begin + 5, $finish - $begin - 5)
          $path = Join-Path $env:RUNNER_TEMP 'hi5-deep-inventory.ps1'
          $output = Join-Path $env:RUNNER_TEMP 'hi5-deep-inventory.stdout'
          $errors = Join-Path $env:RUNNER_TEMP 'hi5-deep-inventory.stderr'
          Set-Content -Path $path -Value $script -Encoding UTF8
          $arguments = @('-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File',('"' + $path + '"'))
          $process = Start-Process -FilePath "$env:WINDIR\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList $arguments -Wait -PassThru -RedirectStandardOutput $output -RedirectStandardError $errors
          $stdout = Get-Content $output -Raw -ErrorAction SilentlyContinue
          $stderr = Get-Content $errors -Raw -ErrorAction SilentlyContinue
          if ($stderr) { Write-Host ('STDERR: ' + $stderr.Substring(0,[Math]::Min(2500,$stderr.Length))) }
          if ($process.ExitCode -ne 0) {
            if ($stdout) { Write-Host ('STDOUT: ' + $stdout.Substring(0,[Math]::Min(2500,$stdout.Length))) }
            throw "PowerShell collector exited $($process.ExitCode)"
          }
          $report = $null
          try { $report = $stdout | ConvertFrom-Json -ErrorAction Stop }
          catch {
            if ($stdout) { Write-Host ('STDOUT_START: ' + $stdout.Substring(0,[Math]::Min(2500,$stdout.Length))) }
            if ($stdout) { Write-Host ('STDOUT_END: ' + $stdout.Substring([Math]::Max(0,$stdout.Length-2500))) }
            throw 'PowerShell collector did not produce valid JSON'
          }
          if (-not $report.deep_inventory_sections) { throw 'PowerShell collector returned no deep inventory section statuses' }
          $statuses = @($report.deep_inventory_sections.PSObject.Properties)
          foreach ($s in $statuses) { Write-Host "$($s.Name): $($s.Value.status)" }
          if (@($statuses | Where-Object { $_.Value.status -eq 'collected' }).Count -eq 0) {
            throw 'PowerShell collector returned zero successful sections'
          }
