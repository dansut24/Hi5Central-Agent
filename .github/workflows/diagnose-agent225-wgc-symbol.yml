name: Diagnose Agent 1.0.225 WGC crash RVA with exact PDB
on:
  push:
    branches:
      - diagnostics/wgc-agent225-rva-20261030
    paths:
      - .github/workflows/diagnose-agent225-wgc-symbol.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  symbolize:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download exact 1.0.225 Agent and symbols from original green run
        uses: actions/download-artifact@v4
        with:
          run-id: 41087176620
          artifact-ids: 12993197271
          github-token: ${{ github.token }}
          path: symbols
      - name: Validate PDB origin and symbolicate new WGC crash
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Get-ChildItem symbols -Recurse -File -Filter Hi5CentralAgent.exe | Select-Object -First 1).FullName
          $pdb=(Get-ChildItem symbols -Recurse -File -Filter Hi5CentralAgent.pdb | Select-Object -First 1).FullName
          $manifest=(Get-ChildItem symbols -Recurse -File -Filter build-manifest.json | Select-Object -First 1).FullName
          if(-not $exe -or -not $pdb -or -not $manifest){throw 'Missing exact Agent/PDB/manifest'}
          $info=Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          Write-Host "SOURCE_MANIFEST: agent_version=$($info.agent_version) commit=$($info.commit) run_id=$($info.run_id)"
          if($info.agent_version -ne '1.0.225' -or $info.commit -ne 'f1137144f006bc8a597ab77741e9183b4fe69475' -or [string]$info.run_id -ne '41087176620'){throw 'PDB source mismatch'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant() -ne $info.exe_sha256){throw 'Executable checksum mismatch'}
          if((Get-FileHash -Algorithm SHA256 -LiteralPath $pdb).Hash.ToLowerInvariant() -ne $info.pdb_sha256){throw 'PDB checksum mismatch'}
          Write-Host 'AGENT225_SOURCE_AND_PDB_SHA256_VERIFIED'
          $candidates=@(
            'C:\Program Files\LLVM\bin\llvm-symbolizer.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe',
            'C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe',
            'C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe',
            'C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\Llvm\x64\bin\llvm-symbolizer.exe'
          )
          $symbolizer=$candidates | Where-Object {Test-Path -LiteralPath $_} | Select-Object -First 1
          if(-not $symbolizer){
            $cmd=Get-Command llvm-symbolizer.exe -ErrorAction SilentlyContinue
            if($cmd){$symbolizer=$cmd.Source}
          }
          if(-not $symbolizer){
            $where=Get-ChildItem 'C:\Program Files\Microsoft Visual Studio' -Filter 'llvm-symbolizer.exe' -Recurse -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if($where){$symbolizer=$where.FullName}
          }
          if(-not $symbolizer){throw 'LLVM symbolizer missing; cannot infer crash function reliably'}
          Write-Host "SYMBOLIZER=$symbolizer"
          foreach($address in @('0x319473','0x31c8e7','0x31c8eb','0x31c8ef','0x31c8f3','0x31c900')){
            Write-Host "=== AGENT225_SYMBOL_RVA=$address ==="
            & $symbolizer --obj="$exe" --inlines --pretty-print $address
            if($LASTEXITCODE -ne 0){throw "Symbolizer failed on $address"}
          }

      - name: Resolve crash offset through matching PDB using native DbgHelp
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Get-ChildItem symbols -Recurse -File -Filter Hi5CentralAgent.exe | Select-Object -First 1).FullName
          $src=Join-Path (Get-Location).Path 'crash-symbol-resolver.cpp'
          $out=Join-Path (Get-Location).Path 'crash-symbol-resolver.exe'
          $code=@'
          #define NOMINMAX
          #include <windows.h>
          #include <dbghelp.h>
          #include <cstdio>
          #include <cstdlib>
          #include <string>
          #pragma comment(lib, "dbghelp.lib")
          int main(int argc,char** argv) {
            if(argc<2) return 3;
            HANDLE p=GetCurrentProcess();
            SymSetOptions(SYMOPT_UNDNAME|SYMOPT_DEFERRED_LOADS|SYMOPT_LOAD_LINES);
            std::string exePath(argv[1]);
            const auto separator=exePath.find_last_of("\\/");
            const std::string pdbDir=separator==std::string::npos?".":exePath.substr(0,separator);
            printf("PDB_SEARCH_DIR=%s\n",pdbDir.c_str());
            if(!SymInitialize(p, pdbDir.c_str(), FALSE)){printf("sym-init-fail=%lu\n",GetLastError());return 4;}
            DWORD64 base=SymLoadModuleEx(p,nullptr,argv[1],nullptr,0x100000000ULL,0,nullptr,0);
            if(!base){printf("sym-load-fail=%lu\n",GetLastError());return 5;}
            IMAGEHLP_MODULE64 mod{};mod.SizeOfStruct=sizeof(mod);
            if(SymGetModuleInfo64(p,base,&mod)) {
              printf("SYM_MODULE_TYPE=%u PDB=%s EXE=%s\n",mod.SymType,mod.LoadedPdbName,mod.ImageName);
            }
            const unsigned offsets[]={0x31c8e0,0x31c8e7,0x31c8eb,0x31c8ef,0x31c8f3,0x31c900};
            for(unsigned addr:offsets){
              char storage[sizeof(SYMBOL_INFO)+MAX_SYM_NAME+8]{};
              auto sym=reinterpret_cast<PSYMBOL_INFO>(storage);
              sym->SizeOfStruct=sizeof(SYMBOL_INFO);
              sym->MaxNameLen=MAX_SYM_NAME;
              DWORD64 displacement=0;
              auto ok=SymFromAddr(p,base+addr,&displacement,sym);
              printf("ADDR=0x%X SYMBOL=%s DISP=%llu ERR=%lu",addr,ok?sym->Name:"<not-found>",
                static_cast<unsigned long long>(displacement),ok?0:GetLastError());
              IMAGEHLP_LINE64 line{};line.SizeOfStruct=sizeof(line);
              DWORD ld=0;
              if(SymGetLineFromAddr64(p,base+addr,&ld,&line)){
                printf(" FILE=%s LINE=%lu LINE_DISP=%lu",line.FileName,line.LineNumber,ld);
              } else printf(" NO_LINE=%lu",GetLastError());
              puts("");
            }
            SymCleanup(p);
            return 0;
          }
          '@
          [IO.File]::WriteAllText($src,$code,[Text.Encoding]::ASCII)
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'No VS C++ compiler'}
          $cmdPath=Join-Path (Get-Location).Path 'build-crash-symbol-resolver.cmd'
          $cmdText="@echo off`r`ncall `"$(Join-Path $vs 'Common7\Tools\VsDevCmd.bat')`" -arch=x64 -host_arch=x64`r`ncl.exe /nologo /EHsc /W3 /MD /Fe:`"$out`" `"$src`" /link dbghelp.lib`r`n"
          [IO.File]::WriteAllText($cmdPath,$cmdText,[Text.Encoding]::ASCII)
          & cmd.exe /d /c $cmdPath
          if($LASTEXITCODE -ne 0){throw "Unable to compile resolver: $LASTEXITCODE"}
          & $out $exe
          if($LASTEXITCODE -ne 0){throw "DbgHelp symbol resolver failed: $LASTEXITCODE"}

      - name: Inspect PE CodeView debug directory and the PDB GUID
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Get-ChildItem symbols -Recurse -File -Filter Hi5CentralAgent.exe | Select-Object -First 1).FullName
          $pdb=(Get-ChildItem symbols -Recurse -File -Filter Hi5CentralAgent.pdb | Select-Object -First 1).FullName
          $readobj='C:\Program Files\LLVM\bin\llvm-readobj.exe'
          $pdbutil='C:\Program Files\LLVM\bin\llvm-pdbutil.exe'
          Write-Host ('EXE_SIZE='+((Get-Item $exe).Length)+' PDB_SIZE='+((Get-Item $pdb).Length))
          Write-Host 'PE_HEADERS_AND_CODEVIEW'
          & $readobj --file-headers --coff-debug-directory "$exe"
          Write-Host 'PDB_SUMMARY'
          & $pdbutil dump -summary "$pdb"
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Write-Host ('DIA_SDK_INCLUDE_EXISTS='+(Test-Path (Join-Path $vs 'DIA SDK\include\dia2.h')))
          Write-Host ('DIA_SDK_LIB_EXISTS='+(Test-Path (Join-Path $vs 'DIA SDK\lib\amd64\diaguids.lib')))
