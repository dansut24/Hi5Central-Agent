name: Windows Agent and Viewer installers

on:
  workflow_dispatch:
  push:
    branches: [main, hardening-mobile-viewer, agent-hardening-v2]
    paths:
      - "Agent/**"
      - "Viewer/**"
      - "ci/**"
      - ".github/workflows/windows-installers.yml"
  pull_request:
    paths:
      - "Agent/**"
      - "Viewer/**"
      - "ci/**"
      - ".github/workflows/windows-installers.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_FEATURE_FLAGS: manifests,binarycaching
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET for Avalonia App Portal
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify local Windows build path is preserved
        shell: pwsh
        run: |
          $required = @(
            'Agent/chatpass_agent/CMakeLists.txt',
            'Agent/chatpass_agent/installer/windows/Build-AgentInstaller.ps1',
            'Agent/chatpass_agent/installer/windows/Hi5CentralAgentSetup.iss',
            'Agent/app_portal/Hi5Central.AppPortal/Hi5Central.AppPortal.csproj',
            'Agent/app_portal/Hi5Central.AppPortal/MainWindow.axaml',
            'Agent/app_portal/Hi5Central.AppPortal/Broker/WindowsNamedPipeAppPortalBroker.cs',
            'Agent/chatpass_agent/src/network/snmp_discovery.h',
            'Agent/chatpass_agent/src/network/snmp_discovery.cpp',
            'Viewer/chatpass_viewer/CMakeLists.txt',
            'Viewer/chatpass_viewer/installer/windows/Build-ViewerInstaller.ps1',
            'Viewer/chatpass_viewer/installer/windows/Hi5CentralViewerSetup.iss'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing local Windows build file: $path" }
          }
          $agentBuild = Get-Content 'Agent/chatpass_agent/installer/windows/Build-AgentInstaller.ps1' -Raw
          if ($agentBuild -notmatch 'Visual Studio 18 2026') { throw 'Local VS 2026 generator default was removed.' }
          if ($agentBuild -notmatch 'C:\\Users\\Dan\\Desktop\\libdatachannel-install-static') {
            throw 'Local libdatachannel default path was removed.'
          }
          if ($agentBuild -notmatch 'dotnet SDK was not found') {
            throw 'Avalonia App Portal publish guard is missing from the Agent installer build.'
          }
          if ($agentBuild -match 'hi5central_app_portal') {
            throw 'Legacy C++ App Portal target is still part of the Agent CMake build.'
          }
          if ($agentBuild -notmatch '/p:Version=\$AgentVersion') {
            throw 'Self Service publish no longer stamps the Agent release version.'
          }
          $installer = Get-Content 'Agent/chatpass_agent/installer/windows/Hi5CentralAgentSetup.iss' -Raw
          if ($installer -notmatch 'StopExistingAgentProcesses') {
            throw 'Installer no longer terminates running Self Service/Agent helper processes before replacement.'
          }
          if ($installer -notmatch 'MyAppPortalExeName') {
            throw 'Installer no longer includes the Self Service executable.'
          }
          $appPortalProject = Get-Content 'Agent/app_portal/Hi5Central.AppPortal/Hi5Central.AppPortal.csproj' -Raw
          if ($appPortalProject -notmatch 'Avalonia.Desktop') {
            throw 'Avalonia desktop dependency is missing from App Portal.'
          }
          if ($appPortalProject -notmatch 'PublishSingleFile') {
            Write-Host 'Single-file publishing is enforced by Build-AgentInstaller.ps1.'
          }
          $appPortalXaml = Get-Content 'Agent/app_portal/Hi5Central.AppPortal/MainWindow.axaml' -Raw
          foreach ($control in @(
            'HomeSummaryPanel','AppCataloguePanel','HomeOverviewPanel','HomeSupportPanel',
            'UpdatesPagePanel','UpdatesPageItems','RequestsPagePanel','RequestsPageItems',
            'DevicePagePanel','SupportPagePanel','SettingsPagePanel'
          )) {
            if ($appPortalXaml -notmatch ('x:Name="' + [regex]::Escape($control) + '"')) {
              throw "Self Service navigation page control is missing: $control"
            }
          }
          if ($appPortalXaml -notmatch '<PathIcon') {
            throw 'Self Service Fluent vector navigation icons are missing.'
          }
          $broker = Get-Content 'Agent/app_portal/Hi5Central.AppPortal/Broker/WindowsNamedPipeAppPortalBroker.cs' -Raw
          if ($broker -notmatch 'Hi5CentralAppPortal') {
            throw 'Avalonia App Portal no longer uses the secured local Agent broker.'
          }
          $cmake = Get-Content 'Agent/chatpass_agent/CMakeLists.txt' -Raw
          $service = Get-Content 'Agent/chatpass_agent/src/platform/windows/windows_service.cpp' -Raw
          $snmp = Get-Content 'Agent/chatpass_agent/src/network/snmp_discovery.cpp' -Raw
          if ($cmake -notmatch 'src/network/snmp_discovery\.cpp') {
            throw 'Native SNMP discovery scanner is missing from the Windows Agent build.'
          }
          if ($service -notmatch 'jobType == \"network\.discovery\.scan\"') {
            throw 'Windows Agent no longer handles first-class network discovery scan jobs.'
          }
          if ($service -notmatch 'jobType == \"network\.discovery\.enrich\"') {
            throw 'Windows Agent no longer handles network discovery enrichment jobs.'
          }
          if ($snmp -notmatch 'RunSnmpDiscovery' -or $snmp -notmatch 'sysObjectID') {
            throw 'Native SNMP discovery implementation is incomplete.'
          }
          if ($snmp -notmatch 'RunNetworkDiscoveryEnrichment' -or $snmp -notmatch 'reverse_dns') {
            throw 'Native network discovery name enrichment implementation is incomplete.'
          }
          foreach ($presenceContract in @('IcmpSendEcho','GetIpNetTable','presenceEnabled','discoveryMethods','nameEnrichmentDeferred','MIB_IPNET_TYPE_INVALID','allZero','allBroadcast')) {
            if ($snmp -notmatch [regex]::Escape($presenceContract)) {
              throw "Native network presence discovery is missing required contract: $presenceContract"
            }
          }
          if ($snmp -notmatch 'private RFC1918 IPv4 ranges') {
            throw 'Native network discovery no longer enforces private RFC1918 target ranges.'
          }
          if ($snmp -match 'powershell|pwsh|RunPowerShellCommand') {
            throw 'Network discovery must remain native and must not invoke PowerShell.'
          }

      - name: Verify enrollment and reconnect safeguards
        shell: pwsh
        run: |
          $installer = Get-Content 'Agent/chatpass_agent/installer/windows/Hi5CentralAgentSetup.iss' -Raw
          $identity = Get-Content 'Agent/chatpass_agent/src/agent_identity.cpp' -Raw
          $service = Get-Content 'Agent/chatpass_agent/src/platform/windows/windows_service.cpp' -Raw
          if ($installer -notmatch 'force_enrollment') { throw 'Installer no longer marks explicit enrollment.' }
          if ($service -notmatch 'install4j_quiet') { throw 'install4j uninstall strategy is missing from the Windows service source.' }
          if ($service -notmatch 'vendor_documented_directory_cleanup') { throw 'Vendor-documented uninstall cleanup fallback is missing from the Windows service source.' }
          if ($identity -notmatch 'packageAlreadyApplied') { throw 'Enrollment replacement guard is missing.' }
          if ($identity -notmatch 'bootstrapToken') { throw 'Bootstrap enrollment override is missing.' }
          if ($service -notmatch 'signalingReconnectRequested_') { throw 'Signaling reconnect state is missing.' }
          if ($service -notmatch 'scheduling reconnect') { throw 'WebSocket close no longer schedules reconnect.' }
          if ($service -notmatch 'jobType == \"windows_update.install\"') { throw 'Compiled Windows service is missing scheduled Windows Update install jobs.' }
          if ($service -notmatch 'jobType == \"windows_update.rollback\"') { throw 'Compiled Windows service is missing Windows Update rollback jobs.' }
          if ($service -notmatch 'BuildWindowsUpdateRollbackScript') { throw 'Compiled Windows service is missing rollback capability implementation.' }
          if ($service -notmatch 'jobType == \"windows_update.manage\"') { throw 'Compiled Windows service is missing Windows Update managed-policy jobs.' }
          if ($service -notmatch 'BuildWindowsUpdateManagementScript') { throw 'Compiled Windows service is missing managed-policy implementation.' }
          if ($service -notmatch 'MDM_Policy_Config01_Update02') { throw 'Compiled Windows service is missing Windows Update Policy CSP management.' }
          if ($service -notmatch 'SetDisablePauseUXAccess') { throw 'Compiled Windows service is missing managed Windows Update pause-UX control.' }
          if ($service -notmatch 'AllowAutoUpdate') { throw 'Compiled Windows service is missing managed Windows Update automatic-update control.' }
          if ($service -match '\$policyManagerAuto\.exists|\$policyManagerPause\.exists') { throw 'Compiled Windows service still treats PolicyManager defaults as external MDM ownership.' }
          if ($service -notmatch 'status == \"conflict\".*status == \"unsupported\"') { throw 'Compiled Windows service is missing non-failure management evaluation outcomes.' }
          if ($service -notmatch 'errorPayload\.is_object') { throw 'App Portal broker no longer forwards structured API errors.' }
          if ($service -match 'app portal HTTP status .* body=') { throw 'App Portal broker is exposing raw HTTP response bodies in exceptions.' }

      - name: Verify remote Viewer and input contracts
        shell: pwsh
        run: ./ci/Verify-RemoteViewerContracts.ps1

      - name: Verify Device Details inventory and live-tool contracts
        shell: pwsh
        run: ./ci/Verify-DeviceDetailsContracts.ps1

      - name: Verify Hi5Central Connect contracts
        shell: pwsh
        run: ./ci/Verify-ConnectContracts.ps1

      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler not found.' }

      - name: Build unsigned Windows installers
        shell: pwsh
        run: |
          ./ci/Build-WindowsInstallers.ps1 -Version "0.1.${{ github.run_number }}"

      - name: Prepare portable Hi5Central Connect host
        shell: pwsh
        run: |
          $source = 'Agent/chatpass_agent/build/Release/Hi5CentralAgentService.exe'
          $target = 'Agent/chatpass_agent/build/Release/Hi5CentralConnect.exe'
          if (-not (Test-Path $source)) { throw 'Agent runtime build output is missing for Connect.' }
          Copy-Item $source $target -Force
          if (-not (Test-Path $target)) { throw 'Portable Hi5Central Connect output was not created.' }

          # Connect is a customer-facing temporary support app, not a console tool.
          # Patch only the copied Connect PE to the Windows GUI subsystem so the
          # shared Agent/Service binary keeps its existing console/service behavior.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $editbin = (Get-Command editbin.exe -ErrorAction SilentlyContinue).Source
          if (-not $editbin -and (Test-Path $vswhere)) {
            $editbin = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\editbin.exe' | Select-Object -First 1)
          }
          if (-not $editbin -or -not (Test-Path $editbin)) { throw 'editbin.exe was not found for the Connect GUI subsystem conversion.' }
          & $editbin /SUBSYSTEM:WINDOWS $target
          if ($LASTEXITCODE -ne 0) { throw "editbin failed to convert Hi5CentralConnect.exe to the Windows GUI subsystem ($LASTEXITCODE)." }

      - name: Verify PatchHost qualification capability
        shell: pwsh
        run: |
          $patchHost = 'Agent/chatpass_agent/build/Release/Hi5CentralPatchHost.exe'
          if (-not (Test-Path $patchHost)) { throw 'PatchHost build output is missing.' }
          $version = (& $patchHost --version | Out-String).Trim()
          $capabilityResponse = (& $patchHost --capabilities | Out-String | ConvertFrom-Json)
          $capabilities = $capabilityResponse.capabilities
          if (-not $capabilities) { throw 'PatchHost capability payload is missing.' }
          Write-Host "PatchHost version: $version"
          if ([version]$version -lt [version]'0.2.9') { throw "PatchHost $version is too old for installer technology qualification." }
          if (-not $capabilities.vendorDirect.artifactInspection) { throw 'PatchHost artifact inspection capability is missing.' }
          if (-not $capabilities.vendorDirect.artifactTechnologyDetection) { throw 'PatchHost artifact technology detection capability is missing.' }
          if (-not $capabilities.vendorDirect.jobScopedResponseFiles) { throw 'PatchHost job-scoped response-file capability is missing.' }
          if (-not $capabilities.vendorDirect.responseFileTargetVersionToken) { throw 'PatchHost response-file target-version token support is missing.' }
          if (-not $capabilities.vendorDirect.customExecution) { throw 'PatchHost App Portal custom execution capability is missing.' }
          if (-not ($capabilities.vendorDirect.customExecutionModes -contains 'powershell')) { throw 'PatchHost PowerShell custom execution mode is missing.' }
          if (-not ($capabilities.vendorDirect.customExecutionModes -contains 'batch')) { throw 'PatchHost batch custom execution mode is missing.' }
          $patchHostSource = Get-Content 'Agent/chatpass_agent/src/patching/patch_host_main.cpp' -Raw
          if ($patchHostSource -notmatch 'msi_configured_arguments') { throw 'PatchHost MSI catalogue argument support is missing.' }
          if ($patchHostSource -notmatch 'configuredArgs = manifest.value') { throw 'PatchHost MSI path no longer reads validated installArguments.' }
          if ($patchHostSource -notmatch 'verification.value\("targetVersion"') { throw 'PatchHost verification no longer honors transformed verification.targetVersion.' }

      - name: Upload Agent installer
        uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-Agent-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            Agent/chatpass_agent/dist/installer/Hi5CentralAgentSetup.exe
            Agent/chatpass_agent/build/Release/Hi5CentralAgentService.exe
            Agent/chatpass_agent/build/Release/Hi5CentralConnect.exe
            Agent/chatpass_agent/build/Release/Hi5CentralRemoteHost.exe
            Agent/chatpass_agent/build/Release/Hi5CentralMediaHost.exe
            Agent/chatpass_agent/build/Release/Hi5CentralPatchHost.exe
            Agent/chatpass_agent/build/Release/Hi5CentralUser.exe
            Agent/chatpass_agent/build/Release/Hi5CentralAppPortal.exe

      - name: Upload Viewer installer
        uses: actions/upload-artifact@v4
        with:
          name: Hi5Central-Viewer-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            Viewer/chatpass_viewer/dist/installer/Hi5CentralViewerSetup.exe
            Viewer/chatpass_viewer/dist/viewer/Hi5CentralViewer.exe
            Viewer/chatpass_viewer/dist/viewer/web/**

      - name: Publish latest test installers
        if: github.event_name == 'push' && (github.ref == 'refs/heads/hardening-mobile-viewer' || github.ref == 'refs/heads/agent-hardening-v2')
        shell: pwsh
        run: |
          $publish = Join-Path $env:RUNNER_TEMP 'hi5central-publish'
          New-Item -ItemType Directory -Force -Path $publish | Out-Null
          Copy-Item 'Agent/chatpass_agent/dist/installer/Hi5CentralAgentSetup.exe' $publish
          Copy-Item 'Agent/chatpass_agent/build/Release/Hi5CentralConnect.exe' $publish
          Copy-Item 'Viewer/chatpass_viewer/dist/installer/Hi5CentralViewerSetup.exe' $publish
          Get-FileHash "$publish\Hi5CentralAgentSetup.exe" -Algorithm SHA256 | ForEach-Object { $_.Hash } | Set-Content "$publish\Hi5CentralAgentSetup.exe.sha256"
          Get-FileHash "$publish\Hi5CentralConnect.exe" -Algorithm SHA256 | ForEach-Object { $_.Hash } | Set-Content "$publish\Hi5CentralConnect.exe.sha256"
          Get-FileHash "$publish\Hi5CentralViewerSetup.exe" -Algorithm SHA256 | ForEach-Object { $_.Hash } | Set-Content "$publish\Hi5CentralViewerSetup.exe.sha256"
          $meta = @{
            build = "0.1.${{ github.run_number }}"
            commit = "${{ github.sha }}"
            generated_at = (Get-Date).ToUniversalTime().ToString('o')
          } | ConvertTo-Json
          $meta | Set-Content "$publish\build.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan build-output
          git rm -rf .
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' } | Remove-Item -Recurse -Force
          New-Item -ItemType Directory -Force -Path latest | Out-Null
          Copy-Item "$publish\*" latest -Force
          git add latest
          git commit -m "Publish Windows test build 0.1.${{ github.run_number }}"
          git push --force origin HEAD:build-output

# Validation trigger: a01aeab cursor-only pipeline optimization