name: Sync Background switch overlay 0.1.45

on:
  push:
    branches: [agent-hardening-v2]
    paths:
      - ".github/workflows/sync-background-switch-overlay-0.1.45.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent-hardening-v2
          fetch-depth: 0
      - name: Download verified source checkpoint
        run: |
          wget -q https://downloads.hi5central.com/bootstrap-agent-sync/background-switch-overlay-0.1.45-f4bc191.tar.gz -O /tmp/background-switch-overlay.tar.gz
          echo "b2e2cd0a1737f38f84a43fb449c9f95a5013f62a23a64412547df94c43e231ae  /tmp/background-switch-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/background-switch-overlay.tar.gz
      - name: Commit source checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Agent/chatpass_agent/src/media_host_main.cpp Agent/chatpass_agent/src/platform/windows/windows_service.cpp Viewer/chatpass_viewer/web/renderer.js
          if git diff --cached --quiet; then
            echo "Source already synchronized"
            exit 0
          fi
          git commit -m "Make Background desktop switching self-clearing [skip ci]"
          git push origin HEAD:agent-hardening-v2
